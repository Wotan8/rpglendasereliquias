<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check — Editar livro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/lendas-reliquias.css">
<link rel="stylesheet" href="shared/sanfona.css">
<link rel="stylesheet" href="shared/acervo.css">
<link rel="stylesheet" href="shared/dialogo.css">
<link rel="stylesheet" href="shared/texto-mundo.css?v=2">
<link rel="stylesheet" href="worldbuilding/css/worldbuilding.css?v=2">
<link rel="stylesheet" href="worldbuilding/css/wb-ferramentas.css?v=18">
<script src="shared/theme.js"></script>
<script src="shared/campo-imagem.js?v=2"></script>

<!-- Troca o Firestore real por um duble em memoria, para o harness rodar
     o wb-editor.js DE VERDADE (nao uma copia do markup).

     O ?v= nas tres linhas abaixo e o MESMO numero de proposito, e sobe junto
     a cada mexida: modulo com query e outro modulo para o navegador, e sem
     isso o harness testa o wb-editor.js que ficou no cache — que foi
     exatamente o que aconteceu na primeira rodada. O duble precisa ser a
     MESMA instancia que o editor enxerga, senao GRAVADO fica vazio. -->
<script type="importmap">
{ "imports": {
    "/worldbuilding/js/firebase-config.js": "/__check-stub-firestore.js?v=5",
    "/worldbuilding/js/wb-editor.js": "/worldbuilding/js/wb-editor.js?v=6"
} }
</script>

<style>
  .chk-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; display: flex; gap: .5rem;
      align-items: center; flex-wrap: wrap; padding: .4rem .6rem; background: var(--lr-bg-1);
      border-bottom: 1px solid var(--lr-border); font: 600 .85rem/1 var(--lr-font-body); color: var(--lr-text-1); }
  .chk-bar button { padding: .2rem .6rem; border: 1px solid var(--lr-border); border-radius: 6px;
      background: var(--lr-surface); color: var(--lr-text-1); font: inherit; cursor: pointer; }
  .main-content { padding-top: 46px; }
  #chkOut { font-weight: 400; }
</style>
</head>
<body>

<div class="chk-bar">
    <strong>Check — Editar livro</strong>
    <button onclick="document.documentElement.classList.toggle('dark')">Tema</button>
    <button id="chkAbrir">Abrir o ⚙️ do livro 1</button>
    <button id="chkRun">▶ Rodar asserts</button>
    <span id="chkOut"></span>
</div>

<main class="main-content">
    <div class="content-header"><h1 class="content-title" id="contentTitle">Escritório do Cronista</h1></div>
    <div class="content-body" id="contentBody"></div>
</main>

<div class="modal wbt-modal" id="wbToolModal">
    <div class="modal-content wbt-modal__content">
        <button class="modal-close wbt-modal__close" data-close>✕</button>
        <div id="wbToolModalBody"></div>
    </div>
</div>

<script type="module">
import { GRAVADO } from './__check-stub-firestore.js?v=5';
import { Editor } from './worldbuilding/js/wb-editor.js';

window.WB = { data: {}, user: { email: 'check@harness' } };
await Editor.render();

const $ = (s) => document.querySelector(s);
const abrirCog = () => $('[data-editbook="b1"]').click();
const espera = (ms = 80) => new Promise(r => setTimeout(r, ms));
// Salvamento deliberado (o mesmo caminho do botao 💾) e volta a Biblioteca.
const save2 = async () => { $('#saveArticle').click(); await espera(200); };
// Tolerante a ja estar na Biblioteca: os blocos de teste rodam em sequencia
// e nem todos terminam dentro do editor.
const voltarBiblioteca = async () => { $('#backLib')?.click(); await espera(250); };
$('#chkAbrir').onclick = abrirCog;

$('#chkRun').onclick = async () => {
    const ok = [], erro = [];
    const t = (nome, cond) => (cond ? ok : erro).push(nome);
    GRAVADO.length = 0;
    abrirCog();

    // 1. Abre na aba Livro, com as outras escondidas.
    t('abre na aba Livro', !$('[data-bkpanel="geral"]').hidden && $('[data-bkpanel="pub"]').hidden);
    t('aba Capitulos existe', !!$('[data-bktab="caps"]'));

    // 2. Trocar de aba mostra uma so.
    $('[data-bktab="caps"]').click();
    t('aba Capitulos abre sozinha',
        !$('[data-bkpanel="caps"]').hidden
        && $('[data-bkpanel="geral"]').hidden && $('[data-bkpanel="pub"]').hidden);
    t('3 linhas de capitulo', document.querySelectorAll('.wb-capedit__row').length === 3);

    // 3. Acoes em massa nascem travadas e destravam com selecao.
    t('massa travada sem selecao', $('#capBulkSt').disabled);
    $('[data-capsel="a1"]').checked = true;
    $('[data-capsel="a1"]').dispatchEvent(new Event('change', { bubbles: true }));
    t('massa destrava com 1 marcado', !$('#capBulkSt').disabled);
    t('contador diz 1', $('#capSelN').textContent.startsWith('1'));

    // 4. So o selecionado muda.
    $('#capBulkSt').value = 'publicado';
    $('#capBulkSt').dispatchEvent(new Event('change'));
    t('massa mudou so o a1',
        $('[data-capst="a1"]').value === 'publicado' && $('[data-capst="a2"]').value === 'publicado'
        && $('[data-capst="a3"]').value === 'rascunho');
    document.querySelector('[data-bulkpub="1"]').click();
    t('massa publicou so o a1',
        $('[data-cappub="a1"]').checked && !$('[data-cappub="a3"]').checked);

    // 5. "Todos" pega tudo.
    $('#capAll').checked = true;
    $('#capAll').dispatchEvent(new Event('change'));
    t('Todos marca os 3', document.querySelectorAll('[data-capsel]:checked').length === 3);
    document.querySelector('[data-bulkpub="0"]').click();
    t('despublica os 3', document.querySelectorAll('[data-cappub]:checked').length === 0);

    // 6. Edicao individual continua valendo.
    $('[data-capst="a3"]').value = 'revisao';
    $('[data-cappub="a3"]').checked = true;

    // 6b. Aviso de publicacao orfa: o livro tem pub marcada, entao esta calado.
    t('sem orfao, o aviso fica escondido', $('#capAviso').hidden);
    document.querySelectorAll('[data-bkpub]').forEach(c => { c.checked = false; });
    document.querySelector('[data-bkpanel="pub"]').dispatchEvent(new Event('change', { bubbles: true }));
    t('livro sem publicacao + capitulo 🌐 acende o aviso', !$('#capAviso').hidden);
    t('a aba avisa junto', $('[data-bktab="caps"]').classList.contains('is-alerta'));
    // Repoe a publicacao que o resto do teste espera.
    $('[data-bkpub="geral"]').checked = true;
    $('[data-bkpub="conhVinculo"]').checked = true;
    document.querySelector('[data-bkpanel="pub"]').dispatchEvent(new Event('change', { bubbles: true }));
    t('repor a publicacao apaga o aviso', $('#capAviso').hidden);

    // 6c. Ordem do sumario pelas setas: desce o a1, sobe o a3.
    const ordemNaTela = () => [...document.querySelectorAll('.wb-capedit [data-caprow]')].map(r => r.dataset.caprow).join(',');
    t('ordem inicial e a do sumario', ordemNaTela() === 'a1,a2,a3');
    t('a primeira linha nao sobe', $('[data-caprow="a1"] [data-capsobe]').disabled);
    t('a ultima linha nao desce', $('[data-caprow="a3"] [data-capdesce]').disabled);
    $('[data-caprow="a1"] [data-capdesce]').click();
    t('descer o a1 troca com o a2', ordemNaTela() === 'a2,a1,a3');
    t('renumerou depois de mover', $('[data-caprow="a1"] .wb-chapter__num').textContent === '2');

    // 6d. Mover o a3 para o outro livro — marca, nao some, e so vale no Salvar.
    document.querySelectorAll('[data-capsel]').forEach(c => { c.checked = c.dataset.capsel === 'a3'; });
    $('[data-capsel="a3"]').dispatchEvent(new Event('change', { bubbles: true }));
    $('#capBulkLivro').value = 'b2';
    $('#capBulkLivro').dispatchEvent(new Event('change'));
    t('a linha marcada continua na lista', ordemNaTela() === 'a2,a1,a3');
    t('a linha mostra o destino', $('[data-caprow="a3"] .wb-capedit__mudou').textContent.includes('Livro sem'));

    // 7. Salvar grava o livro + SO os capitulos que mudaram.
    document.querySelectorAll('[data-capsel]').forEach(c => { c.checked = false; });
    await $('#bkSave').onclick();
    const livro = GRAVADO.find(g => g.col === 'worldbuilding-books');
    t('gravou o livro', !!livro);
    const caps = GRAVADO.filter(g => g.col === 'worldbuilding-articles');
    // a1: rascunho->publicado; a2: era publicado+publico, virou privado; a3: ->revisao+publico
    t('gravou so os 3 alterados', caps.length === 3);
    const c = (id) => caps.find(x => x.id === id);
    t('a1 publicado e privado', c('a1').data.status === 'publicado' && c('a1').data.public === false);
    t('a2 segue publicado, agora privado', c('a2').data.status === 'publicado' && c('a2').data.public === false);
    t('a3 revisao e publico', c('a3').data.status === 'revisao' && c('a3').data.public === true);
    t('capitulo grava por merge', caps.every(x => x.merge === true));
    t('nao tocou no avulso a9', !caps.some(x => x.id === 'a9'));
    // Ordem: a2 subiu para 0 e a1 desceu para 1 (o a3 saiu do livro).
    t('gravou a nova ordem do sumario', c('a2').data.order === 0 && c('a1').data.order === 1);
    t('a3 mudou de livro', c('a3').data.bookId === 'b2');
    t('a3 entra no fim do livro de destino', c('a3').data.order === 0);
    t('quem ficou nao mudou de livro', c('a1').data.bookId === 'b1' && c('a2').data.bookId === 'b1');

    // 8. Estantes e publicacao do livro sobrevivem ao round-trip.
    t('estanteIds preservado', JSON.stringify(livro.data.estanteIds) === '["e1"]');
    t('pub do livro preservado', livro.data.pub.geral === true && livro.data.pub.mestre === false);

    // ── Biblioteca: busca, filtro de status e memoria de estante ──
    // O mesmo livro aparece em varias estantes — contar por id, nao por no.
    const unicos = (sel, attr) => [...new Set([...document.querySelectorAll('#contentBody ' + sel)].map(el => el.dataset[attr]))].sort();
    const capsNaTela = () => unicos('[data-openart]', 'openart');
    const livrosNaTela = () => unicos('[data-book]', 'book');
    const buscar = (txt) => { const i = $('#libBusca'); i.value = txt; i.dispatchEvent(new Event('input')); };
    const filtrar = (v) => document.querySelector('[data-fst="' + v + '"]').click();

    // Estado depois do salvamento acima: a1 publicado/privado, a2 publicado/
    // privado, a3 revisao/publico, a9 avulso rascunho/privado.
    t('sem filtro, os 2 livros aparecem', livrosNaTela().length === 2);
    t('sem filtro, o avulso aparece', capsNaTela().includes('a9'));

    buscar('recibo');
    t('busca acha so o a2', String(capsNaTela()) === 'a2');
    t('busca esconde o livro sem match', String(livrosNaTela()) === 'b1');
    t('busca abre a estante sozinha', document.querySelector('.wb-estante__det').open);
    t('busca conta 1 texto', $('#contentBody').textContent.includes('1 texto'));

    buscar('Vaugh');
    t('titulo do livro traz os capitulos dele', String(capsNaTela()) === 'a1,a2');

    buscar('zzzzz');
    t('busca sem resultado avisa', !!document.querySelector('.wbt-empty'));

    buscar('');
    filtrar('revisao');
    t('status revisao acha so o a3', String(capsNaTela()) === 'a3');
    filtrar('revisao');
    t('reclicar o chip desliga o filtro', livrosNaTela().length === 2);

    filtrar('privado');
    t('privado pega a1, a2 e o avulso', String(capsNaTela()) === 'a1,a2,a9');
    t('privado nao pega o a3 publico', !capsNaTela().includes('a3'));
    $('#libLimpar').click();
    t('Limpar zera busca e filtro', livrosNaTela().length === 2 && $('#libBusca').value === '');

    const det = document.querySelector('[data-estante="e1"] .wb-estante__det');
    det.open = true; det.dispatchEvent(new Event('toggle'));
    t('estante aberta foi guardada',
        (localStorage.getItem('wb-cronista-estantes-abertas') || '').includes('e1'));

    // Palavras vem do campo `words` quando existe, sem recontar o HTML.
    // a2 tem words:900 gravado e 2 palavras de HTML. 903 = 900 + a1 (3) + a3 (0):
    // se recontasse o HTML daria 5.
    t('usa o words gravado, nao reconta o HTML', $('#contentBody').textContent.includes('903 palavras'));

    // ── Duplicar ──
    const antesLivros = livrosNaTela().length, antesCaps = capsNaTela().length;
    GRAVADO.length = 0;
    await $('[data-dupart="a2"]').onclick(new Event('click'));
    await espera();
    const copiaCap = GRAVADO.find(g => g.col === 'worldbuilding-articles');
    t('duplicar capitulo grava um doc novo', !!copiaCap && copiaCap.id !== 'a2');
    t('a copia leva "(copia)" no titulo', copiaCap.data.title.includes('(cópia)'));
    t('a copia nasce rascunho e privada',
        copiaCap.data.status === 'rascunho' && copiaCap.data.public === false);
    t('a copia fica no mesmo livro', copiaCap.data.bookId === 'b1');
    t('a copia aparece na tela', capsNaTela().length === antesCaps + 1);

    GRAVADO.length = 0;
    $('[data-dupbook="b1"]').onclick(new Event('click'));   // pergunta antes (shared/dialogo.js)
    await espera();
    const okDialogo = document.querySelector('.lr-dialogo .lr-dialogo-ok');
    t('duplicar livro pergunta antes', !!okDialogo);
    okDialogo.click();
    await espera(400);
    const copiaLivro = GRAVADO.find(g => g.col === 'worldbuilding-books');
    t('duplicar livro grava o livro', !!copiaLivro && copiaLivro.id !== 'b1');
    t('a copia do livro nasce sem publicacao',
        Object.values(copiaLivro.data.pub).every(v => v === false));
    t('a copia do livro nasce sem versao', copiaLivro.data.versao === '');
    const capsCopiados = GRAVADO.filter(g => g.col === 'worldbuilding-articles');
    t('os 3 capitulos vieram junto', capsCopiados.length === 3);
    t('os capitulos copiados apontam para o livro novo',
        capsCopiados.every(x => x.data.bookId === copiaLivro.id));
    t('o livro copiado aparece na tela', livrosNaTela().length === antesLivros + 1);

    // ── Editor: aviso de saida com texto nao salvo e Ctrl+S ──
    document.querySelector('[data-estante="__todas"] summary').click();
    await espera();
    document.querySelector('[data-book="b1"] summary').click();
    await espera();
    $('[data-openart="a1"]').click();
    await espera();
    t('capitulo abre no editor', !!$('#richEditor'));

    $('#richEditor').dispatchEvent(new Event('input'));
    t('digitar avisa que nao salvou', $('#editorStatus').textContent.includes('não salvas'));
    const saida = new Event('beforeunload', { cancelable: true });
    window.dispatchEvent(saida);
    t('fechar a aba com texto sujo e barrado', saida.defaultPrevented);

    GRAVADO.length = 0;
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 's', ctrlKey: true, bubbles: true, cancelable: true }));
    await espera(150);
    t('Ctrl+S grava o capitulo aberto',
        GRAVADO.some(g => g.col === 'worldbuilding-articles' && g.id === 'a1'));
    t('Ctrl+S carimba a hora', $('#editorStatus').textContent.startsWith('✓ Salvo'));
    const saida2 = new Event('beforeunload', { cancelable: true });
    window.dispatchEvent(saida2);
    t('depois de salvo, sair nao e barrado', !saida2.defaultPrevented);

    // ── Historico de versao ──
    const histGravado = () => GRAVADO.filter(g => g.col === 'worldbuilding-settings' && g.id === 'hist_a1');
    t('Ctrl+S guardou uma versao', histGravado().length === 1);
    t('a versao carrega o HTML', !!histGravado()[0].data.versoes[0].html);
    t('o status diz que guardou versao', $('#editorStatus').textContent.includes('versão guardada'));

    GRAVADO.length = 0;
    await save2();   // salvar de novo, com o MESMO texto
    t('salvar sem mudanca nao duplica versao', histGravado().length === 0);

    $('#richEditor').innerHTML = '<p>texto novo depois da versao</p>';
    GRAVADO.length = 0;
    await save2();
    t('texto novo vira versao nova', histGravado()[0].data.versoes.length === 2);
    t('a mais nova vem primeiro', histGravado()[0].data.versoes[0].html.includes('texto novo'));

    // O autosave NAO pode guardar versao — senao o historico vira carretel.
    GRAVADO.length = 0;
    $('#richEditor').innerHTML = '<p>rascunho do autosave</p>';
    $('#richEditor').dispatchEvent(new Event('input'));
    await espera(4300);
    t('o autosave gravou o capitulo', GRAVADO.some(g => g.col === 'worldbuilding-articles'));
    t('mas o autosave NAO guardou versao', histGravado().length === 0);

    // Abrir a janela de versoes e restaurar.
    $('#verVersoes').click();
    await espera(150);
    t('a janela lista as versoes', document.querySelectorAll('[data-versao]').length >= 2);
    document.querySelector('[data-versao="1"] [data-vver]').click();
    t('Ver abre a previa da versao', !document.querySelector('[data-versao="1"] .wb-versao__corpo').hidden);
    document.querySelector('[data-versao="1"] [data-vrest]').click();
    await espera();
    document.querySelector('.lr-dialogo .lr-dialogo-ok')?.click();
    await espera(250);
    t('restaurar joga a versao no editor', $('#richEditor').innerHTML.includes('um dois tres'));
    t('restaurar deixa o texto por salvar', $('#editorStatus').textContent.includes('salve'));
    const vers = histGravado().at(-1)?.data.versoes || [];
    t('restaurar guardou antes o texto de agora',
        vers.some(v => (v.html || '').includes('rascunho do autosave')));

    // ── Interruptor do salvamento automatico ──
    t('a barra de propriedades esta acima da barra de acoes',
        !!$('#editorProps') && ($('#editorProps').compareDocumentPosition($('.wbt-etoolbar')) & Node.DOCUMENT_POSITION_FOLLOWING) !== 0);
    t('os 4 campos continuam la',
        !!$('#artBook') && !!$('#artOrder') && !!$('#artStatus') && !!$('#artPublic'));
    t('auto nasce ligado', $('#autoSave').checked);

    $('#autoSave').checked = false;
    $('#autoSave').dispatchEvent(new Event('change'));
    t('desligar fica lembrado', localStorage.getItem('wb-cronista-autosave') === 'false');
    GRAVADO.length = 0;
    $('#richEditor').innerHTML = '<p>digitado com o auto desligado</p>';
    $('#richEditor').dispatchEvent(new Event('input'));
    t('desligado, o aviso diz por que', $('#editorStatus').textContent.includes('auto está desligado'));
    await espera(4300);
    t('desligado, NAO grava sozinho', !GRAVADO.some(g => g.col === 'worldbuilding-articles'));
    // Mas o 💾 continua gravando, e o beforeunload continua barrando a saida.
    const saidaAuto = new Event('beforeunload', { cancelable: true });
    window.dispatchEvent(saidaAuto);
    t('desligado, sair com texto sujo ainda e barrado', saidaAuto.defaultPrevented);
    await save2();
    t('desligado, o 💾 grava do mesmo jeito', GRAVADO.some(g => g.col === 'worldbuilding-articles'));

    $('#autoSave').checked = true;
    $('#autoSave').dispatchEvent(new Event('change'));
    GRAVADO.length = 0;
    $('#richEditor').innerHTML = '<p>de volta com o auto ligado</p>';
    $('#richEditor').dispatchEvent(new Event('input'));
    await espera(4300);
    t('religado, volta a gravar sozinho', GRAVADO.some(g => g.col === 'worldbuilding-articles'));

    // ── Aparencia do livro ──
    // A essa altura o teste esta DENTRO do editor: volta e reabre o ⚙️.
    await voltarBiblioteca();
    abrirCog();
    $('[data-bktab="estilo"]').click();
    const amostra = $('#bkAmostra');
    t('a aba Aparencia tem a amostra', !!amostra);
    t('livro sem aparencia nao emite variavel', (amostra.getAttribute('style') || '') === '');

    const corpo = document.querySelector('[data-est="fonteTexto"]');
    corpo.value = "'Inter', system-ui, sans-serif";
    corpo.dispatchEvent(new Event('input', { bubbles: true }));
    t('escolher fonte pinta a amostra na hora', amostra.getAttribute('style').includes('--tm-fonte:'));

    const larg = document.querySelector('[data-est="largura"]');
    larg.value = '68'; larg.dispatchEvent(new Event('input', { bubbles: true }));
    t('a medida entra com o sufixo', amostra.getAttribute('style').includes('--tm-largura:68ch'));
    t('o numero aparece ao lado do controle', document.querySelector('[data-estout="largura"]').textContent === '68ch');

    const cor = document.querySelector('[data-est="corTitulo"]');
    t('cor nunca tocada nasce marcada como vazia', cor.hasAttribute('data-vazio'));
    cor.value = '#88ccff'; cor.dispatchEvent(new Event('input', { bubbles: true }));
    t('tocar na cor tira a marca de vazia', !cor.hasAttribute('data-vazio'));

    // A aspa simples segura o nome de familia com espaco — cortar ela
    // quebraria toda pilha de fonte serifada.
    const fTit = document.querySelector('[data-est="fonteTitulo"]');
    fTit.value = "'Cormorant Garamond', Georgia, serif";
    fTit.dispatchEvent(new Event('input', { bubbles: true }));
    // A amostra so vale como amostra se NADA da tela vencer o que o autor
    // escolheu — `.wbt-modal h2` vencia, e ela mentia a cor do titulo.
    const corH2 = document.querySelector('[data-est="corTitulo"]');
    corH2.value = '#8b1e1e'; corH2.dispatchEvent(new Event('input', { bubbles: true }));
    t('nada da tela vence a cor de titulo da amostra',
        getComputedStyle(amostra.querySelector('h2')).color === 'rgb(139, 30, 30)');
    t('a pilha de fonte sobrevive inteira',
        amostra.getAttribute('style').includes("--tm-fonte-titulo:'Cormorant Garamond', Georgia, serif"));

    GRAVADO.length = 0;
    await $('#bkSave').onclick();
    const est = GRAVADO.find(g => g.col === 'worldbuilding-books').data.estilo;
    t('grava so o que foi tocado',
        !!est.fonteTexto && !!est.largura && !!est.corTitulo && est.corTexto === undefined);
    t('a medida vai ao banco SEM o sufixo', est.largura === '68');

    // Reabrir tem de trazer de volta o que foi escolhido.
    abrirCog();
    $('[data-bktab="estilo"]').click();
    t('reabrir traz a aparencia de volta',
        $('#bkAmostra').getAttribute('style').includes('--tm-largura:68ch'));
    $('#bkEstiloZerar').click();
    t('Voltar ao padrao limpa tudo', ($('#bkAmostra').getAttribute('style') || '') === '');
    GRAVADO.length = 0;
    await $('#bkSave').onclick();
    t('zerado, o livro grava estilo vazio',
        Object.keys(GRAVADO.find(g => g.col === 'worldbuilding-books').data.estilo).length === 0);

    // ── Janela de imagem: centrada, e o tipo carimbado pela extensao ──
    CampoImagem.escolher({ titulo: 'Inserir imagem', pasta: 'worldbuilding-images' });
    await espera(120);
    const dlg = document.querySelector('dialog.ci-dlg');
    /* `* { margin: 0 }` do worldbuilding.css apaga o `margin: auto` do
       navegador e joga o <dialog> modal no canto. O componente repoe o auto
       na propria regra dele — e e a REGRA que se afirma aqui, nao a
       geometria: medir o centro exige viewport, e o painel do navegador as
       vezes roda com 0x0, o que faria a conta mentir os dois jeitos. */
    const regraDlg = [...document.styleSheets]
        .flatMap(f => { try { return [...f.cssRules]; } catch { return []; } })
        .find(r => r.selectorText === 'dialog.ci-dlg');
    t('a janela de imagem repoe o margin:auto que o reset apagou',
        !!regraDlg && regraDlg.style.margin === 'auto');
    const cx = dlg.getBoundingClientRect();
    t('e com viewport de verdade, ela abre no centro',
        innerWidth < 10 || (Math.abs((cx.left + cx.right) / 2 - innerWidth / 2) < 4
            && Math.abs((cx.top + cx.bottom) / 2 - innerHeight / 2) < 4));
    dlg.querySelector('[data-ci-cancel]').click();
    // .jfif e a extensao que o Chrome da a um JPEG salvo no Windows, e o
    // seletor as vezes nao devolve type nenhum — ai a regra do Storage nega
    // por contentType, num arquivo que e imagem.
    t('.jfif sem type passa na validacao',
        CampoImagem.validar(new File([new Uint8Array(4)], 'foto.jfif', { type: '' })) === null);
    t('o que nao e imagem continua recusado',
        CampoImagem.validar(new File([new Uint8Array(4)], 'planilha.xlsx', { type: '' })) !== null);

    // ── Lixeira ──
    await voltarBiblioteca();
    const antesLixo = capsNaTela().length;
    GRAVADO.length = 0;
    $('[data-delart="a9"]').click();
    await espera();
    document.querySelector('.lr-dialogo .lr-dialogo-ok').click();
    await espera(250);
    t('excluir SAI mesmo da colecao de artigos',
        GRAVADO.some(g => g.col === 'worldbuilding-articles' && g.id === 'a9' && g.apagado));
    t('o texto foi para a lixeira',
        GRAVADO.some(g => g.id === 'lixeira' && g.data.itens.some(i => i.id === 'a9')));
    t('some da Biblioteca', !capsNaTela().includes('a9'));
    t('a estante Lixeira aparece', !!document.querySelector('[data-estante="__lixeira"]'));
    t('a Lixeira nao tem ⚙️ de renomear', !document.querySelector('[data-estante="__lixeira"] .wb-estante__cog'));
    t('a lixeira guarda o texto inteiro',
        GRAVADO.find(g => g.id === 'lixeira').data.itens[0].contentHTML !== undefined);

    document.querySelector('[data-estante="__lixeira"] summary').click();
    await espera();
    GRAVADO.length = 0;
    $('[data-restlix="a9"]').click();
    await espera(250);
    t('resgatar devolve o doc para os artigos',
        GRAVADO.some(g => g.col === 'worldbuilding-articles' && g.id === 'a9' && !g.apagado));
    t('resgatar tira da lixeira',
        GRAVADO.find(g => g.id === 'lixeira').data.itens.every(i => i.id !== 'a9'));
    t('volta para a Biblioteca', capsNaTela().length === antesLixo);
    t('a estante Lixeira some quando esvazia', !document.querySelector('[data-estante="__lixeira"]'));

    $('#chkOut').innerHTML = erro.length
        ? '<span style="color:var(--lr-blood)">✗ ' + erro.length + ' falha(s): ' + erro.join(' · ') + '</span>'
        : '<span style="color:var(--lr-nature)">✓ ' + ok.length + '/' + ok.length + ' passaram</span>';
    console.log({ ok, erro, GRAVADO });
};
</script>
</body>
</html>
