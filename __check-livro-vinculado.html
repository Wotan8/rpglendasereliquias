<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Check — Livro Vinculado</title>
<link rel="stylesheet" href="./shared/acervo.css?v=1">
<link rel="stylesheet" href="./shared/dialogo.css?v=2">
<script type="module">import './shared/dialogo.js?v=2';</script>
    <link rel="stylesheet" href="shared/tokens.css">
    <link rel="stylesheet" href="shared/texto-mundo.css">
    <style>
        body { font-family: system-ui, sans-serif; background: #14110f; color: #eee; padding: 24px; }
        .detail-section { border: 1px solid #333; border-radius: 8px; padding: 12px; margin: 12px 0; }
        .detail-section-title { font-weight: 700; margin-bottom: 6px; }
        .detail-tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .detail-tag { background: #2a2622; border: 1px solid #443; border-radius: 999px; padding: 4px 10px; font-size: .85rem; }
        #res div { margin: 2px 0; }
        .ok { color: #4ade80; } .fail { color: #ef4444; }
    </style>
</head>
<body>
    <h1>📖 Livro Vinculado — check</h1>
    <div id="res"></div>
    <h3>Raça com capítulos escolhidos (só 1 e 3)</h3>
    <div id="alvo1"></div>
    <h3>Classe sem escolha (livro inteiro)</h3>
    <div id="alvo2"></div>
    <h3>Tribo sem livro (nada deve aparecer)</h3>
    <div id="alvo3"></div>
    <h3>Classe com DOIS livros (formato novo)</h3>
    <div id="alvo4"></div>

    <script src="shared/livro-vinculado.js"></script>
    <script>
        const ACERVO = {
            livros: [
                { id: 'b1', title: 'Crônicas de Vasteluna', description: 'O livro da raça.' },
                { id: 'b2', title: 'Manual do Guerreiro' },
            ],
            caps: [
                { id: 'c1', bookId: 'b1', order: 1, title: 'O Despertar', synopsis: 'Como tudo começou.', contentHTML: '<p>Texto do capítulo <b>um</b>.</p>' },
                { id: 'c2', bookId: 'b1', order: 2, title: 'A Queda' },
                { id: 'c3', bookId: 'b1', order: 3, title: 'O Retorno', contentHTML: '<p>Fim.</p>' },
                { id: 'c9', bookId: 'b2', order: 1, title: 'Postura de Combate' },
            ],
        };
        window.lvSeedLivros(ACERVO);

        // Formato legado (objeto único) — docs em produção seguem assim para sempre.
        const raca = { nome: 'Elorin', livroVinculado: { bookId: 'b1', capituloIds: ['c1', 'c3'] } };
        const classe = { nome: 'Guerreiro', livroVinculado: { bookId: 'b2', capituloIds: [] } };
        const tribo = { nome: 'Comuno' };
        // Formato novo (array) — e o legado junto, para provar que o array manda.
        const druida = {
            nome: 'Druida',
            livroVinculado: { bookId: 'b1', capituloIds: ['c2'] },
            livrosVinculados: [
                { bookId: 'b1', capituloIds: ['c1'] },
                { bookId: 'b2', capituloIds: [] },
            ],
        };

        document.getElementById('alvo1').innerHTML = window.lvSecaoHTML(raca);
        document.getElementById('alvo2').innerHTML = window.lvSecaoHTML(classe);
        document.getElementById('alvo3').innerHTML = window.lvSecaoHTML(tribo);
        document.getElementById('alvo4').innerHTML = window.lvSecaoHTML(druida);

        const res = document.getElementById('res');
        const diz = (ok, txt) => res.insertAdjacentHTML('beforeend',
            `<div class="${ok ? 'ok' : 'fail'}">${ok ? '✅' : '❌'} ${txt}</div>`);

        const tick = () => new Promise(r => setTimeout(r, 0));
        // O leitor pinta depois da promise do acervo — esperar o elemento aparecer
        // é mais honesto do que contar ticks.
        const espera = async (sel, n = 40) => {
            for (let i = 0; i < n; i++) { const el = document.querySelector(sel); if (el) return el; await tick(); }
            return null;
        };
        const btn = (sel) => document.querySelector(`${sel} button`);

        // O preenchimento é assíncrono (promise do acervo).
        (async () => {
            await tick();

            const b1 = btn('#alvo1');
            diz(!!b1, 'raça mostra um botão único de abrir o livro');
            diz(b1 && b1.textContent.includes('Abrir livro') && b1.textContent.includes('Crônicas de Vasteluna'),
                'botão diz "Abrir livro" com o nome do livro');
            diz(document.getElementById('alvo1').textContent.includes('2 capítulos disponíveis'),
                'raça conta só os capítulos liberados (2)');

            diz(document.getElementById('alvo2').textContent.includes('1 capítulo disponível'),
                'classe sem escolha conta o livro inteiro do b2 (1)');
            diz(document.getElementById('alvo3').innerHTML.trim() === '', 'tribo sem livro não renderiza nada');

            // Livro de vários capítulos → sumário
            b1.click();
            await tick(); await tick();
            let ov = document.getElementById('lvLeitor');
            diz(!!ov && ov.textContent.includes('Sumário'), 'livro com vários capítulos abre no sumário');
            const linhas = ov.querySelectorAll('button.lv-cap');
            diz(linhas.length === 2, `sumário lista só os liberados (esperado 2, veio ${linhas.length})`);
            diz(!ov.textContent.includes('A Queda'), 'sumário não vaza capítulo não liberado');

            // Sumário → capítulo → volta
            linhas[0].click();
            await tick(); await tick();
            ov = document.getElementById('lvLeitor');
            diz(ov.querySelector('.texto-mundo')?.innerHTML.includes('<b>um</b>'), 'capítulo renderiza o HTML do texto');
            const voltar = [...ov.querySelectorAll('button')].find(b => b.textContent.includes('Sumário'));
            diz(!!voltar, 'capítulo tem botão de voltar ao sumário');
            voltar.click();
            await tick(); await tick();
            diz(document.getElementById('lvLeitor').textContent.includes('Sumário'), 'voltar retorna ao sumário');

            document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
            await tick();
            diz(!document.getElementById('lvLeitor'), 'ESC fecha o leitor');

            // Livro de um capítulo só → vai direto ao texto, sem sumário
            btn('#alvo2').click();
            await tick(); await tick();
            ov = document.getElementById('lvLeitor');
            diz(ov && ov.textContent.includes('Postura de Combate') && !ov.textContent.includes('Sumário'),
                'livro de 1 capítulo abre direto no texto');
            ov.remove();

            // ===== Formato novo: dois livros na mesma entidade =====
            const sec4 = document.getElementById('alvo4');
            const botoes4 = sec4.querySelectorAll('button');
            diz(botoes4.length === 2, `entidade com 2 livros mostra 2 botões (veio ${botoes4.length})`);
            diz(sec4.textContent.includes('Livros vinculados'), 'título vai para o plural com vários livros');
            diz(botoes4[0]?.textContent.includes('Crônicas de Vasteluna')
                && botoes4[1]?.textContent.includes('Manual do Guerreiro'), 'um botão para cada livro, na ordem');
            diz(!sec4.textContent.includes('A Queda'),
                'array novo manda: o livroVinculado legado da mesma entidade é ignorado');

            // Cada botão abre o seu próprio livro (índices independentes).
            botoes4[1].click();
            await tick(); await tick();
            ov = document.getElementById('lvLeitor');
            diz(ov && ov.textContent.includes('Postura de Combate'), 'o 2º botão abre o 2º livro');
            ov.remove();

            botoes4[0].click();
            await tick(); await tick();
            ov = document.getElementById('lvLeitor');
            diz(ov && ov.textContent.includes('Texto do capítulo'), 'o 1º botão abre o 1º livro');
            window.lvFechar();

            // ===== Biblioteca (Painel do Mestre / Tabuleiro) =====
            window.lvBiblioteca({
                titulo: '📖 Estante',
                filtro: (l) => l.id === 'b1',
                acaoCapitulo: (cap) => `<button type="button" class="lv-acao" data-cap="${cap.id}">📡</button>`,
            });
            await tick(); await tick();
            ov = document.getElementById('lvLeitor');
            const livros = ov.querySelectorAll('button.lv-livro');
            diz(livros.length === 1, `estante respeita o filtro (esperado 1, veio ${livros.length})`);
            diz(ov.textContent.includes('3 capítulos'), 'card do livro conta os capítulos');

            livros[0].click();
            await tick(); await tick();
            ov = document.getElementById('lvLeitor');
            diz(ov.querySelectorAll('button.lv-cap').length === 3,
                'pela estante o livro abre inteiro, sem recorte de vínculo');
            diz(ov.querySelectorAll('button.lv-acao').length === 3, 'cada capítulo ganha a ação do chamador');

            ov.querySelector('button.lv-cap').click();
            await tick(); await tick();
            ov = document.getElementById('lvLeitor');
            diz(!!ov.querySelector('button.lv-acao'), 'a ação também aparece dentro do capítulo');
            let volta = [...ov.querySelectorAll('button')].find(b => b.textContent.includes('Sumário'));
            volta.click(); await tick(); await tick();
            volta = [...document.getElementById('lvLeitor').querySelectorAll('button')].find(b => b.textContent.includes('Estante'));
            diz(!!volta, 'do sumário dá para voltar à estante');
            volta.click();
            diz(!!await espera('button.lv-livro'), 'voltar chega na estante');

            // Repintar mantém o lugar (é o que roda quando o mestre exibe um capítulo)
            document.querySelector('button.lv-livro').click();
            await espera('button.lv-cap');
            window.lvRepintar();
            await tick(); await tick();
            diz(document.getElementById('lvLeitor').querySelectorAll('button.lv-cap').length === 3,
                'repintar redesenha o sumário, sem voltar para a estante');

            // ===== Janela: arrastar, redimensionar e travar capítulo =====
            window.lvFechar();
            window.lvBiblioteca({
                titulo: '📖 Estante', filtro: () => true,
                capituloEstado: (cap, livro) => cap.id === 'c2' ? 'bloqueado' : (cap.id === 'c3' ? 'oculto' : 'liberado'),
                notaBloqueio: 'Requisitos na ficha',
            });
            await espera('button.lv-livro');
            let jan = document.getElementById('lvLeitor');
            diz(jan.getBoundingClientRect().width < window.innerWidth,
                'a janela não cobre a tela (dá para seguir jogando atrás)');

            document.querySelector('button.lv-livro').click();
            await espera('button.lv-cap');
            jan = document.getElementById('lvLeitor');
            diz(jan.querySelectorAll('.lv-cap-lock').length === 1, 'capítulo bloqueado aparece com cadeado');
            diz(!jan.querySelector('.lv-cap-lock')?.onclick, 'capítulo bloqueado não abre a leitura');
            diz(!jan.textContent.includes('O Retorno'), 'capítulo oculto some do sumário');
            diz(jan.textContent.includes('Requisitos na ficha'), 'a nota explica o cadeado');

            // arrastar pela barra
            const barra = jan.querySelector('.lv-barra');
            const antes = jan.getBoundingClientRect().left;
            const ev = (t, x, y) => barra.dispatchEvent(new PointerEvent(t, { pointerId: 1, clientX: x, clientY: y, bubbles: true }));
            barra.setPointerCapture = () => {}; barra.releasePointerCapture = () => {}; barra.hasPointerCapture = () => true;
            ev('pointerdown', 400, 20); ev('pointermove', 250, 120); ev('pointerup', 250, 120);
            const depois = jan.getBoundingClientRect().left;
            diz(depois !== antes && depois >= 0, `arrastar move a janela (${Math.round(antes)} → ${Math.round(depois)})`);
            diz(getComputedStyle(jan).resize === 'both', 'a janela tem alça de redimensionar');

            // a posição escolhida volta na próxima abertura
            const pos = { l: jan.style.left, t: jan.style.top };
            window.lvFechar();
            window.lvBiblioteca({ titulo: '📖 Estante', filtro: () => true });
            await espera('button.lv-livro');
            jan = document.getElementById('lvLeitor');
            diz(jan.style.left === pos.l && jan.style.top === pos.t, 'a janela reabre onde o jogador deixou');

            // Fechar limpa a trilha: leitura de vínculo depois disso não herda o "← Estante"
            window.lvFechar();
            btn('#alvo2').click();
            await tick(); await tick();
            ov = document.getElementById('lvLeitor');
            diz(![...ov.querySelectorAll('button')].some(b => b.textContent.includes('Estante')),
                'fechar apaga a trilha de volta da estante');
            window.lvFechar();
        })();
    </script>
</body>
</html>
