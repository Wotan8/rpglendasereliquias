<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lendas e Relíquias - Worldbuilding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8b5cf6;
            --secondary: #ec4899;
            --dark: #1e1b4b;
            --darker: #0f172a;
            --light: #f8fafc;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            color: var(--light);
            min-height: 100vh;
            display: flex;
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(139, 92, 246, 0.2);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            margin-top: 20px;
            color: var(--primary);
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background: rgba(15, 23, 42, 0.95);
            border-right: 2px solid var(--border);
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-title {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .sidebar-search {
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            background: rgba(30, 27, 75, 0.6);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--light);
            font-size: 0.9rem;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .sidebar-nav {
            flex: 1;
            padding: 10px 0;
        }

        .nav-category {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .nav-category:hover {
            background: rgba(139, 92, 246, 0.1);
            border-left-color: var(--primary);
        }

        .nav-category.active {
            background: rgba(139, 92, 246, 0.2);
            border-left-color: var(--primary);
        }

        .nav-icon {
            font-size: 1.2rem;
        }

        .nav-label {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .btn-new-entry {
            margin: 15px;
            padding: 12px;
            background: linear-gradient(135deg, var(--success), #059669);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-new-entry:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .btn-back {
            margin: 15px;
            padding: 10px;
            background: rgba(100, 116, 139, 0.3);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--light);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .btn-back:hover {
            background: rgba(100, 116, 139, 0.5);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            padding: 20px 30px;
            background: rgba(30, 27, 75, 0.6);
            border-bottom: 2px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content-title {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .content-body {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        /* Dashboard */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(30, 27, 75, 0.6);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .stat-card:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .stat-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        /* Entries Grid */
        .entries-section {
            margin-top: 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--light);
        }

        .entries-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .entry-card {
            background: rgba(30, 27, 75, 0.8);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .entry-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.2);
        }

        .entry-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .entry-name {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .entry-type {
            display: inline-block;
            padding: 4px 10px;
            background: var(--primary);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .entry-desc {
            color: #94a3b8;
            font-size: 0.85rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Linked Entities */
        .linked-entities-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .linked-entity-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(30, 27, 75, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .linked-entity-item:hover {
            border-color: var(--primary);
        }

        .linked-entity-name {
            font-weight: 600;
            color: var(--light);
            min-width: 150px;
        }

        .linked-entity-title {
            flex: 1;
            padding: 6px 10px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--light);
            font-size: 0.85rem;
        }

        .linked-entity-title:focus {
            outline: none;
            border-color: var(--primary);
        }

        .linked-entity-remove {
            background: rgba(239, 68, 68, 0.2);
            border: none;
            color: var(--danger);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .linked-entity-remove:hover {
            background: var(--danger);
            color: white;
        }

        .add-linked-entity {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .add-linked-entity select {
            flex: 1;
        }

        .add-linked-entity button {
            padding: 8px 16px;
            background: var(--primary);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .add-linked-entity button:hover {
            background: var(--secondary);
        }

        .entity-type-badge {
            padding: 2px 8px;
            background: rgba(139, 92, 246, 0.3);
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--primary);
        }

        /* Image Preview */
        .image-preview-container {
            margin-top: 10px;
        }

        .image-preview {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            border: 2px solid var(--border);
            object-fit: cover;
            display: none;
        }

        .image-preview.visible {
            display: block;
        }

        .no-entries {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .no-entries-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Filters */
        .filters-bar {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter-select {
            padding: 10px 15px;
            background: rgba(30, 27, 75, 0.6);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--light);
            font-size: 0.9rem;
            min-width: 150px;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 10001;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            border: 2px solid var(--primary);
            border-radius: 20px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px 30px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 30px;
        }

        .form-section {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .form-section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .form-input,
        .form-select,
        .form-textarea {
            padding: 12px;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--light);
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
            font-family: inherit;
        }

        .modal-footer {
            padding: 20px 30px;
            border-top: 2px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
        }

        .btn-secondary {
            background: rgba(100, 116, 139, 0.5);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* Alert */
        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 12px;
            font-weight: 700;
            z-index: 10002;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .alert-success {
            background: var(--success);
            color: white;
        }

        .alert-danger {
            background: var(--danger);
            color: white;
        }

        .alert-warning {
            background: var(--warning);
            color: white;
        }

        /* Image Gallery */
        .image-gallery {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .gallery-item {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid var(--border);
            cursor: pointer;
        }

        .gallery-item:hover {
            border-color: var(--primary);
        }

        .add-image-btn {
            width: 80px;
            height: 80px;
            border: 2px dashed var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
            color: #64748b;
            transition: all 0.3s;
        }

        .add-image-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Tags */
        .tags-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .tag {
            padding: 4px 12px;
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid var(--primary);
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tag-remove {
            cursor: pointer;
            opacity: 0.7;
        }

        .tag-remove:hover {
            opacity: 1;
        }

        /* Connections */
        .connections-list {
            margin-top: 15px;
        }

        .connection-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(30, 27, 75, 0.4);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .connection-type {
            font-size: 0.75rem;
            padding: 2px 8px;
            background: var(--secondary);
            border-radius: 4px;
        }

        .connection-name {
            flex: 1;
            font-weight: 600;
        }

        /* Session Logs Styles */
        .campaign-selector-container {
            background: rgba(30, 27, 75, 0.8);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .campaign-selector-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .campaign-selector-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
        }

        .campaign-select {
            flex: 1;
            max-width: 400px;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--light);
            font-size: 1rem;
            cursor: pointer;
        }

        .campaign-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-favorite {
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #64748b;
        }

        .btn-favorite:hover:not(:disabled) {
            border-color: var(--secondary);
            color: var(--secondary);
            transform: scale(1.1);
        }

        .btn-favorite.active {
            color: #fbbf24;
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
        }

        .btn-favorite:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .campaign-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .campaign-info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .campaign-info-label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .campaign-info-value {
            font-weight: 600;
            color: var(--light);
        }

        /* Character Checkbox Grid for Campaign Modal */
        .character-checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding: 5px;
        }

        .character-checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .character-checkbox-item:hover {
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.8);
        }

        .character-checkbox-item.selected {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }

        .character-checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--success);
        }

        .character-checkbox-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }

        .character-checkbox-name {
            font-weight: 600;
            color: var(--light);
            font-size: 0.9rem;
        }

        .character-checkbox-player {
            font-size: 0.75rem;
            color: #64748b;
        }

        /* Player Checkbox Info in Notification Panel */
        .player-checkbox-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .player-checkbox-char {
            font-weight: 600;
            color: var(--light);
            font-size: 0.85rem;
        }

        .player-checkbox-name {
            font-size: 0.7rem;
            color: #64748b;
        }

        .player-checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .player-checkbox-item:hover {
            border-color: var(--primary);
        }

        .player-checkbox-item:has(input:checked) {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }

        .sessions-list-container {
            margin-top: 20px;
        }

        .sessions-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .sessions-search-bar {
            display: flex;
            gap: 10px;
            flex: 1;
            max-width: 500px;
        }

        .sessions-search-input {
            flex: 1;
            padding: 10px 15px;
            background: rgba(30, 27, 75, 0.6);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--light);
            font-size: 0.9rem;
        }

        .sessions-search-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .session-card {
            background: rgba(30, 27, 75, 0.8);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .session-card:hover {
            border-color: var(--primary);
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.2);
        }

        .session-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .session-number {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
        }

        .session-date {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .session-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .session-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .session-badge.duration {
            background: rgba(139, 92, 246, 0.2);
            color: var(--primary);
        }

        .session-badge.players {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .session-badge.xp {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .session-summary {
            color: #cbd5e1;
            font-size: 0.9rem;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .session-highlights {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .highlight-tag {
            padding: 3px 8px;
            background: rgba(100, 116, 139, 0.3);
            border-radius: 4px;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .highlight-tag.npc {
            background: rgba(236, 72, 153, 0.2);
            color: var(--secondary);
        }

        .highlight-tag.location {
            background: rgba(139, 92, 246, 0.2);
            color: var(--primary);
        }

        .highlight-tag.quest {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        /* Session Detail Modal Sections */
        .session-detail-section {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .session-detail-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .session-detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .detail-item {
            background: rgba(30, 27, 75, 0.5);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .detail-item-label {
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 5px;
        }

        .detail-item-value {
            font-weight: 600;
            color: var(--light);
        }

        .player-presence-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .player-tag {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .player-tag.present {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .player-tag.absent {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .npc-card,
        .location-card,
        .combat-card,
        .quest-card,
        .moment-card {
            background: rgba(30, 27, 75, 0.5);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }

        .npc-card-header,
        .location-card-header,
        .combat-card-header,
        .quest-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .npc-name,
        .location-name,
        .combat-title,
        .quest-name {
            font-weight: 700;
            color: var(--light);
        }

        .npc-role,
        .location-type {
            font-size: 0.75rem;
            padding: 2px 8px;
            background: var(--secondary);
            border-radius: 4px;
            color: white;
        }

        .quest-status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .quest-status.started {
            background: rgba(139, 92, 246, 0.2);
            color: var(--primary);
        }

        .quest-status.in-progress {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .quest-status.completed {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .moment-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .moment-type.funny {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .moment-type.epic {
            background: rgba(139, 92, 246, 0.2);
            color: var(--primary);
        }

        .moment-type.dramatic {
            background: rgba(236, 72, 153, 0.2);
            color: var(--secondary);
        }

        .loot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .loot-item {
            background: rgba(30, 27, 75, 0.5);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .loot-item-icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .loot-item-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--light);
        }

        .loot-item-qty {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .next-session-hooks {
            list-style: none;
        }

        .next-session-hooks li {
            padding: 10px 15px;
            background: rgba(30, 27, 75, 0.5);
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid var(--primary);
            color: #cbd5e1;
        }

        /* Import/Export Buttons */
        .import-export-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-import,
        .btn-export {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-import {
            background: rgba(139, 92, 246, 0.2);
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-export {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .btn-import:hover,
        .btn-export:hover {
            transform: translateY(-2px);
        }

        /* Player EXP Cards */
        .player-exp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .player-exp-card {
            background: rgba(30, 27, 75, 0.6);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
        }

        .player-exp-card.present {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }

        .player-exp-card .player-info {
            flex: 1;
            min-width: 0;
        }

        .player-exp-card .player-name {
            font-weight: 700;
            color: var(--light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-exp-card .player-character {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .player-exp-card .exp-input-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .player-exp-card .exp-input {
            width: 70px;
            padding: 6px 10px;
            background: rgba(30, 27, 75, 0.8);
            border: 2px solid var(--border);
            border-radius: 6px;
            color: var(--light);
            text-align: center;
            font-weight: 600;
        }

        .player-exp-card .exp-label {
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 600;
        }

        /* Search Select Container */
        .search-select-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .search-select-row select {
            flex: 1;
        }

        .search-select-row .btn-add-from-select {
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .search-select-row .btn-add-from-select:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
        }

        /* Searchable Autocomplete Dropdown */
        .autocomplete-container {
            position: relative;
            flex: 1;
        }

        .autocomplete-input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(30, 27, 75, 0.6);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--light);
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .autocomplete-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .autocomplete-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            max-height: 250px;
            overflow-y: auto;
            background: rgba(30, 27, 75, 0.98);
            border: 2px solid var(--primary);
            border-radius: 8px;
            z-index: 1000;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .autocomplete-dropdown.show {
            display: block;
        }

        .autocomplete-item {
            padding: 10px 14px;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid rgba(100, 116, 139, 0.2);
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item:hover,
        .autocomplete-item.selected {
            background: rgba(139, 92, 246, 0.3);
        }

        .autocomplete-item .item-name {
            font-weight: 600;
            color: var(--light);
        }

        .autocomplete-item .item-type {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .autocomplete-no-results {
            padding: 12px 14px;
            color: #64748b;
            text-align: center;
            font-style: italic;
        }

        /* Session Item Tags */
        .session-item-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .session-item-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid var(--primary);
            border-radius: 20px;
            color: var(--light);
            font-size: 0.85rem;
        }

        .session-item-tag .remove-tag {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1rem;
            padding: 0;
            line-height: 1;
        }

        .session-item-tag .remove-tag:hover {
            color: #ff6b6b;
        }

        /* Session Gallery */
        .session-gallery-container {
            margin-top: 12px;
        }

        .session-gallery-input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .session-gallery-input-row input {
            flex: 1;
        }

        .session-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
        }

        .session-gallery-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--border);
            aspect-ratio: 1;
        }

        .session-gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .session-gallery-item .gallery-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 4px 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 0.7rem;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .session-gallery-item .remove-gallery-item {
            position: absolute;
            top: 4px;
            right: 4px;
            background: var(--danger);
            border: none;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .session-gallery-item:hover .remove-gallery-item {
            opacity: 1;
        }

        /* Timeline */
        .campaign-timeline {
            position: relative;
            padding-left: 30px;
            margin-top: 20px;
        }

        .campaign-timeline::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--primary), var(--secondary));
        }

        .timeline-item {
            position: relative;
            padding: 15px 20px;
            background: rgba(30, 27, 75, 0.6);
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s;
        }

        .timeline-item:hover {
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 20px;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            border: 2px solid var(--darker);
        }

        .timeline-date {
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 5px;
        }

        .timeline-title {
            font-weight: 700;
            color: var(--light);
        }

        /* Wiki/Glossary */
        .wiki-section {
            margin-top: 30px;
        }

        .wiki-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .wiki-tab {
            padding: 10px 20px;
            background: rgba(30, 27, 75, 0.6);
            border: none;
            border-radius: 8px 8px 0 0;
            color: #94a3b8;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .wiki-tab.active {
            background: var(--primary);
            color: white;
        }

        .wiki-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .wiki-card {
            background: rgba(30, 27, 75, 0.6);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .wiki-card:hover {
            border-color: var(--primary);
        }

        .wiki-card-name {
            font-weight: 700;
            color: var(--light);
            margin-bottom: 5px;
        }

        .wiki-card-count {
            font-size: 0.75rem;
            color: #64748b;
        }

        /* Image Gallery */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .gallery-item-card {
            position: relative;
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid var(--border);
            transition: all 0.3s;
        }

        .gallery-item-card:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .gallery-item-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item-card .gallery-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Notification Panel */
        .notification-panel {
            background: rgba(30, 27, 75, 0.8);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .notification-panel-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .notification-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .player-select-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .player-checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            cursor: pointer;
        }

        .player-checkbox-item input {
            accent-color: var(--primary);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--light);
            margin-bottom: 10px;
        }

        .empty-state-desc {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        /* Session Form Specific Styles */
        .array-input-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .array-item-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .array-item-row input {
            flex: 1;
        }

        .btn-add-array-item {
            padding: 8px 16px;
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid var(--primary);
            border-radius: 6px;
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-add-array-item:hover {
            background: var(--primary);
            color: white;
        }

        .btn-remove-array-item {
            padding: 6px 10px;
            background: rgba(239, 68, 68, 0.2);
            border: none;
            border-radius: 6px;
            color: var(--danger);
            cursor: pointer;
        }

        .collapsible-section {
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .collapsible-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(30, 27, 75, 0.6);
            cursor: pointer;
            transition: background 0.3s;
        }

        .collapsible-header:hover {
            background: rgba(30, 27, 75, 0.8);
        }

        .collapsible-title {
            font-weight: 700;
            color: var(--light);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .collapsible-toggle {
            transition: transform 0.3s;
        }

        .collapsible-section.open .collapsible-toggle {
            transform: rotate(180deg);
        }

        .collapsible-content {
            padding: 15px;
            display: none;
            background: rgba(15, 23, 42, 0.4);
        }

        .collapsible-section.open .collapsible-content {
            display: block;
        }

        /* View Mode Tabs */
        .view-mode-tabs {
            display: flex;
            gap: 5px;
            background: rgba(15, 23, 42, 0.6);
            padding: 5px;
            border-radius: 10px;
        }

        .view-mode-tab {
            padding: 8px 16px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: #94a3b8;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .view-mode-tab.active {
            background: var(--primary);
            color: white;
        }
    </style>
</head>

            <input type="text" class="search-input" id="globalSearch" placeholder="🔍 Buscar em tudo...">

                <span class="nav-icon">📍</span>
                <span class="nav-label">Geografia</span>

                <span class="nav-icon">🏠</span>
                <span class="nav-label">Propriedades</span>
            </div>
            <div class="nav-category" data-category="npcs">
                <span class="nav-icon">👥</span>
                <span class="nav-label">NPCs</span>
            </div>
            <div class="nav-category" data-category="factions">
                <span class="nav-icon">⚔️</span>
                <span class="nav-label">Tribos</span>
            </div>
            <div class="nav-category" data-category="history">
                <span class="nav-icon">📜</span>
                <span class="nav-label">História</span>
            </div>
            <div class="nav-category" data-category="cultures">
                <span class="nav-icon">🎭</span>
                <span class="nav-label">Culturas</span>

                <span class="nav-icon">✨</span>

        </nav>
        <button class="btn-new-entry" id="btnNewEntry">➕ Nova Entrada</button>
        <button class="btn-back" onclick="window.location.href='mestre.html'">← Voltar ao Painel</button>
    </div>

    <main class="main-content">
        <div class="content-header">
            <h1 class="content-title" id="contentTitle">Dashboard</h1>
            <span id="userEmail" style="color: #94a3b8;"></span>
        </div>
        <div class="content-body" id="contentBody"></div>
    </main>

    <!-- Entry Modal -->
    <div class="modal" id="entryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="entryModalTitle">Nova Entrada</h2>
                <button class="modal-close" onclick="closeEntryModal()">✕</button>
            </div>
            <div class="modal-body" id="entryModalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeEntryModal()">Cancelar</button>
                <button class="btn btn-danger" id="btnDeleteEntry" style="display:none;"
                    onclick="deleteCurrentEntry()">🗑️ Excluir</button>
                <button class="btn btn-success" onclick="saveEntry()">💾 Salvar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, getDocs, getDoc, setDoc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6r79XcsMr3KZUT1YZ8vQntIGspgULXcE",
            authDomain: "rpg-lendasereliquias.firebaseapp.com",
            projectId: "rpg-lendasereliquias",
            storageBucket: "rpg-lendasereliquias.firebasestorage.app",
            messagingSenderId: "546994339773",
            appId: "1:546994339773:web:0116cf7c8667f113075cd4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentCategory = 'dashboard';
        let currentEditingEntry = null;
        let allData = { geography: [], npcs: [], factions: [], history: [], cultures: [], magic: [], religion: [], properties: [] };
        let linkedNpcs = []; // For Geography - NPCs/Creatures with titles
        let linkedTribos = []; // For Geography (Vila, Cidade, Região) - Tribes with titles
        let linkedCulturas = []; // For Factions/Tribes - Cultures with titles
        let linkedNpcsProperty = []; // For Properties - NPCs with titles
        let linkedItems = []; // For Properties - Items with titles (location/sale status)
        let allItems = []; // All available loose items from Firebase

        // Session Logs variables
        let allCampaigns = [];
        let allSessions = [];
        let allCharacters = []; // Characters for campaign player selection
        let currentCampaign = null;
        let currentSession = null;
        let currentViewMode = 'list'; // 'list', 'timeline', 'wiki', 'gallery'
        let favoriteCampaignId = null; // Favorite campaign ID
        let sessionSelectedItems = []; // Selected items for session (with IDs)
        let sessionGalleryImages = []; // Gallery images for session

        const categoryConfig = {
            geography: { collection: 'worldbuilding-geography', icon: '📍', title: 'Geografia', types: ['Continente', 'Região', 'Cidade', 'Vila', 'Ponto de Interesse'] },
            properties: { collection: 'worldbuilding-properties', icon: '🏠', title: 'Propriedades', types: ['Castelo', 'Taverna', 'Choupana', 'Loja', 'Templo', 'Fortaleza', 'Mansão', 'Fazenda', 'Outro'] },
            npcs: { collection: 'npcs', icon: '👥', title: 'NPCs', types: ['NPC', 'Criatura'] },
            factions: { collection: 'worldbuilding-factions', icon: '⚔️', title: 'Tribos', types: ['Tribo', 'Facção', 'Organização'] },
            history: { collection: 'worldbuilding-history', icon: '📜', title: 'História', types: ['Era', 'Evento', 'Período'] },
            cultures: { collection: 'worldbuilding-cultures', icon: '🎭', title: 'Culturas', types: ['Cultura', 'Sociedade', 'Tradição'] },
            magic: { collection: 'worldbuilding-magic', icon: '✨', title: 'Magia/Tecnologia', types: ['Escola de Magia', 'Tecnologia', 'Artefato'] },
            religion: { collection: 'worldbuilding-religion', icon: '🏛️', title: 'Religião', types: ['Divindade', 'Culto', 'Templo', 'Mito'] }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('userEmail').textContent = user.email;
                await loadAllData();
                document.getElementById('loadingScreen').style.display = 'none';
                renderDashboard();
            } else {
                window.location.href = 'index.html';
            }
        });

        async function loadAllData() {
            for (const [key, config] of Object.entries(categoryConfig)) {
                try {
                    const snapshot = await getDocs(collection(db, config.collection));
                    allData[key] = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                } catch (e) { console.log(`Error loading ${key}:`, e); allData[key] = []; }
            }
            // Load items for property linking (only loose items - not assigned to characters)
            try {
                const itemsSnapshot = await getDocs(collection(db, 'items'));
                allItems = itemsSnapshot.docs
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .filter(item => !item.characterId); // Only loose items
                console.log(`Loaded ${allItems.length} loose items for property linking`);
            } catch (e) { console.log('Error loading items:', e); allItems = []; }

            // Load campaigns
            try {
                const campaignsSnapshot = await getDocs(collection(db, 'campaigns'));
                allCampaigns = campaignsSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                console.log(`Loaded ${allCampaigns.length} campaigns`);
            } catch (e) { console.log('Error loading campaigns:', e); allCampaigns = []; }

            // Load session logs
            try {
                const sessionsSnapshot = await getDocs(collection(db, 'session-logs'));
                allSessions = sessionsSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                console.log(`Loaded ${allSessions.length} session logs`);
            } catch (e) { console.log('Error loading sessions:', e); allSessions = []; }

            // Load characters for campaign player selection
            try {
                const charactersSnapshot = await getDocs(collection(db, 'characters'));
                allCharacters = charactersSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                console.log(`Loaded ${allCharacters.length} characters for campaigns`);
            } catch (e) { console.log('Error loading characters:', e); allCharacters = []; }

            // Load favorite campaign setting
            try {
                const settingsDoc = await getDoc(doc(db, 'worldbuilding-settings', 'session-logs'));
                if (settingsDoc.exists() && settingsDoc.data().favoriteCampaignId) {
                    favoriteCampaignId = settingsDoc.data().favoriteCampaignId;
                    // Auto-select favorite campaign
                    currentCampaign = allCampaigns.find(c => c.id === favoriteCampaignId) || null;
                    console.log(`Favorite campaign loaded: ${favoriteCampaignId}`);
                }
            } catch (e) { console.log('Error loading favorite campaign:', e); }
        }

        function showAlert(message, type) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 3000);
        }

        // Navigation
        document.querySelectorAll('.nav-category').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-category').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                currentCategory = item.dataset.category;
                if (currentCategory === 'dashboard') {
                    document.getElementById('contentTitle').textContent = 'Dashboard';
                    renderDashboard();
                } else if (currentCategory === 'session-logs') {
                    document.getElementById('contentTitle').textContent = 'Logs de Sessão';
                    // Auto-select favorite campaign when navigating to session logs
                    if (favoriteCampaignId) {
                        currentCampaign = allCampaigns.find(c => c.id === favoriteCampaignId) || currentCampaign;
                    }
                    renderSessionLogs();
                } else {
                    document.getElementById('contentTitle').textContent = categoryConfig[currentCategory].title;
                    renderCategoryList(currentCategory);
                }
            });
        });

        // Dashboard
        function renderDashboard() {
            const body = document.getElementById('contentBody');
            const stats = Object.entries(categoryConfig).map(([key, config]) => `
                <div class="stat-card" onclick="navigateToCategory('${key}')">
                    <div class="stat-icon">${config.icon}</div>
                    <div class="stat-value">${allData[key]?.length || 0}</div>
                    <div class="stat-label">${config.title}</div>
                </div>
            `).join('');

            const recentEntries = Object.entries(allData)
                .flatMap(([cat, entries]) => entries.map(e => ({ ...e, category: cat })))
                .sort((a, b) => new Date(b.lastUpdate || 0) - new Date(a.lastUpdate || 0))
                .slice(0, 6);

            body.innerHTML = `
                <div class="dashboard-grid">${stats}</div>
                <div class="entries-section">
                    <div class="section-header">
                        <h2 class="section-title">📝 Entradas Recentes</h2>
                    </div>
                    <div class="entries-grid" id="recentEntries">
                        ${recentEntries.length ? recentEntries.map(e => renderEntryCard(e, e.category)).join('') :
                    '<div class="no-entries"><div class="no-entries-icon">📝</div><p>Nenhuma entrada ainda. Clique em "Nova Entrada" para começar!</p></div>'}
                    </div>
                </div>
            `;
        }
        window.navigateToCategory = (cat) => {
            document.querySelector(`[data-category="${cat}"]`).click();
        };

        function renderEntryCard(entry, category) {
            const config = categoryConfig[category];
            return `
                <div class="entry-card" onclick="openEntry('${category}', '${entry.id}')">
                    ${entry.imagem ? `<img src="${entry.imagem}" class="entry-image" onerror="this.style.display='none'">` : ''}
                    <span class="entry-type">${config.icon} ${entry.tipo || config.types[0]}</span>
                    <div class="entry-name">${entry.nome || entry.titulo || 'Sem nome'}</div>
                    <div class="entry-desc">${entry.descricao || entry.historia || ''}</div>
                </div>
            `;
        }

        function renderCategoryList(category) {
            const config = categoryConfig[category];
            const entries = allData[category] || [];
            const body = document.getElementById('contentBody');

            body.innerHTML = `
                <div class="filters-bar">
                    <select class="filter-select" id="filterType" onchange="filterEntries()">
                        <option value="">Todos os tipos</option>
                        ${config.types.map(t => `<option value="${t}">${t}</option>`).join('')}
                    </select>
                </div>
                <div class="entries-grid" id="entriesGrid">
                    ${entries.length ? entries.map(e => renderEntryCard(e, category)).join('') :
                    `<div class="no-entries"><div class="no-entries-icon">${config.icon}</div><p>Nenhuma entrada em ${config.title}. Clique em "Nova Entrada" para criar!</p></div>`}
                </div>
            `;
        }

        window.filterEntries = function () {
            const typeFilter = document.getElementById('filterType').value.toLowerCase();
            let entries = allData[currentCategory] || [];
            if (typeFilter) entries = entries.filter(e => (e.tipo || '').toLowerCase() === typeFilter);
            document.getElementById('entriesGrid').innerHTML = entries.length ?
                entries.map(e => renderEntryCard(e, currentCategory)).join('') :
                '<div class="no-entries"><p>Nenhuma entrada encontrada com esses filtros.</p></div>';
        };

        // Modal & CRUD
        document.getElementById('btnNewEntry').addEventListener('click', () => openEntryModal());

        function openEntryModal(entry = null) {
            currentEditingEntry = entry;
            const modal = document.getElementById('entryModal');
            const title = document.getElementById('entryModalTitle');
            const body = document.getElementById('entryModalBody');
            const deleteBtn = document.getElementById('btnDeleteEntry');

            const cat = currentCategory === 'dashboard' ? 'geography' : currentCategory;
            const config = categoryConfig[cat];

            title.textContent = entry ? `Editar ${config.title}` : `Nova Entrada - ${config.title}`;
            deleteBtn.style.display = entry ? 'block' : 'none';

            // Initialize linked entities from entry
            linkedNpcs = entry?.linkedNpcs || [];
            linkedTribos = entry?.linkedTribos || [];
            linkedCulturas = entry?.linkedCulturas || [];
            linkedNpcsProperty = entry?.linkedNpcsProperty || [];
            linkedItems = entry?.linkedItems || [];

            let extraFields = '';
            let geographySections = '';
            let factionsSections = '';

            if (cat === 'geography') {
                // Get available NPCs from data
                const availableNpcs = allData.npcs || [];
                // Get tribes from factions (type === 'Tribo')
                const availableTribos = (allData.factions || []).filter(f => f.tipo === 'Tribo');

                extraFields = `
                    <div class="form-group"><label class="form-label">Clima</label><input type="text" class="form-input" id="entryClima" value="${entry?.clima || ''}" placeholder="Ex: Tropical, Árido, Temperado..."></div>
                    <div class="form-group"><label class="form-label">População</label><input type="text" class="form-input" id="entryPopulacao" value="${entry?.populacao || ''}" placeholder="Ex: ~5.000 habitantes"></div>
                    <div class="form-group"><label class="form-label">Recursos</label><input type="text" class="form-input" id="entryRecursos" value="${entry?.recursos || ''}" placeholder="Ex: Minérios, Agricultura..."></div>
                    <div class="form-group"><label class="form-label">Governo</label><input type="text" class="form-input" id="entryGoverno" value="${entry?.governo || ''}" placeholder="Ex: Monarquia, Conselho de Anciões..."></div>
                    <div class="form-group" style="grid-column: 1/-1;"><label class="form-label">Pontos de Referência</label><textarea class="form-textarea" id="entryLandmarks" rows="2" placeholder="Locais notáveis, construções famosas...">${entry?.landmarks || ''}</textarea></div>
                    <div class="form-group" style="grid-column: 1/-1;"><label class="form-label">Perigos</label><textarea class="form-textarea" id="entryPerigos" rows="2" placeholder="Ameaças conhecidas, áreas perigosas...">${entry?.perigos || ''}</textarea></div>
                    <div class="form-group" style="grid-column: 1/-1;"><label class="form-label">História do Local</label><textarea class="form-textarea" id="entryHistoriaLocal" rows="3" placeholder="Eventos passados relevantes...">${entry?.historiaLocal || ''}</textarea></div>
                `;

                // NPC/Creature linking section (for all geography types)
                geographySections = `
                <div class="form-section">
                    <h3 class="form-section-title">👥 NPCs/Criaturas neste Local</h3>
                    <div class="linked-entities-list" id="linkedNpcsList"></div>
                    <div class="add-linked-entity">
                        <select class="form-select" id="selectNpcToLink">
                            <option value="">Selecionar NPC/Criatura...</option>
                            ${availableNpcs.map(n => `<option value="${n.id}" data-name="${n.nome}" data-type="${n.tipo || 'NPC'}">${n.nome} (${n.tipo || 'NPC'})</option>`).join('')}
                        </select>
                        <button type="button" onclick="addLinkedNpc()">+ Adicionar</button>
                    </div>
                </div>
                `;

                // Tribe linking section (only for Vila, Cidade, Região)
                const entryTipo = entry?.tipo || config.types[0];
                if (['Vila', 'Cidade', 'Região'].includes(entryTipo)) {
                    geographySections += `
                    <div class="form-section" id="tribosSectionContainer">
                        <h3 class="form-section-title">🏕️ Tribos Presentes</h3>
                        <div class="linked-entities-list" id="linkedTribosList"></div>
                        <div class="add-linked-entity">
                            <select class="form-select" id="selectTriboToLink">
                                <option value="">Selecionar Tribo...</option>
                                ${availableTribos.map(t => `<option value="${t.id}" data-name="${t.nome}">${t.nome}</option>`).join('')}
                            </select>
                            <button type="button" onclick="addLinkedTribo()">+ Adicionar</button>
                        </div>
                    </div>
                    `;
                }
            } else if (cat === 'factions') {
                // Get available cultures from data
                const availableCulturas = allData.cultures || [];

                extraFields = `
                    <div class="form-group"><label class="form-label">Liderança</label><input type="text" class="form-input" id="entryLideranca" value="${entry?.lideranca || ''}" placeholder="Ex: Chefe Guerreiro, Conselho de Anciões..."></div>
                    <div class="form-group"><label class="form-label">Ideologia</label><input type="text" class="form-input" id="entryIdeologia" value="${entry?.ideologia || ''}" placeholder="Ex: Honra em batalha, Proteção da natureza..."></div>
                    <div class="form-group"><label class="form-label">Territórios</label><input type="text" class="form-input" id="entryTerritorios" value="${entry?.territorios || ''}" placeholder="Ex: Montanhas do Norte, Floresta Sombria..."></div>
                    <div class="form-group"><label class="form-label">Aliados</label><input type="text" class="form-input" id="entryAliados" value="${entry?.aliados || ''}" placeholder="Ex: Tribo das Águias, Reino de Eldor..."></div>
                    <div class="form-group"><label class="form-label">Inimigos</label><input type="text" class="form-input" id="entryInimigos" value="${entry?.inimigos || ''}" placeholder="Ex: Tribo dos Lobos, Império Sombrio..."></div>
                `;

                // Culture linking section for factions
                factionsSections = `
                <div class="form-section">
                    <h3 class="form-section-title">🎭 Culturas da Tribo</h3>
                    <div class="linked-entities-list" id="linkedCulturasList"></div>
                    <div class="add-linked-entity">
                        <select class="form-select" id="selectCulturaToLink">
                            <option value="">Selecionar Cultura...</option>
                            ${availableCulturas.map(c => `<option value="${c.id}" data-name="${c.nome}" data-type="${c.tipo || 'Cultura'}">${c.nome} (${c.tipo || 'Cultura'})</option>`).join('')}
                        </select>
                        <button type="button" onclick="addLinkedCultura()">+ Adicionar</button>
                    </div>
                </div>
                `;
            } else if (cat === 'history') {
                extraFields = `
                    <div class="form-group"><label class="form-label">Era/Período</label><input type="text" class="form-input" id="entryEra" value="${entry?.era || ''}"></div>
                    <div class="form-group"><label class="form-label">Data Início</label><input type="text" class="form-input" id="entryDataInicio" value="${entry?.dataInicio || ''}"></div>
                    <div class="form-group"><label class="form-label">Data Fim</label><input type="text" class="form-input" id="entryDataFim" value="${entry?.dataFim || ''}"></div>
                    <div class="form-group"><label class="form-label">Participantes</label><input type="text" class="form-input" id="entryParticipantes" value="${entry?.participantes || ''}"></div>
                    <div class="form-group"><label class="form-label">Consequências</label><textarea class="form-textarea" id="entryConsequencias">${entry?.consequencias || ''}</textarea></div>
                `;
            } else if (cat === 'cultures') {
                extraFields = `
                    <div class="form-group"><label class="form-label">Costumes</label><textarea class="form-textarea" id="entryCostumes">${entry?.costumes || ''}</textarea></div>
                    <div class="form-group"><label class="form-label">Tradições</label><textarea class="form-textarea" id="entryTradicoes">${entry?.tradicoes || ''}</textarea></div>
                    <div class="form-group"><label class="form-label">Estrutura Social</label><input type="text" class="form-input" id="entryEstruturaSocial" value="${entry?.estruturaSocial || ''}"></div>
                    <div class="form-group"><label class="form-label">Idiomas</label><input type="text" class="form-input" id="entryIdiomas" value="${entry?.idiomas || ''}"></div>
                `;
            } else if (cat === 'magic') {
                extraFields = `
                    <div class="form-group"><label class="form-label">Regras</label><textarea class="form-textarea" id="entryRegras">${entry?.regras || ''}</textarea></div>
                    <div class="form-group"><label class="form-label">Limitações</label><textarea class="form-textarea" id="entryLimitacoes">${entry?.limitacoes || ''}</textarea></div>
                `;
            } else if (cat === 'religion') {
                extraFields = `
                    <div class="form-group"><label class="form-label">Domínios</label><input type="text" class="form-input" id="entryDominios" value="${entry?.dominios || ''}"></div>
                    <div class="form-group"><label class="form-label">Símbolos</label><input type="text" class="form-input" id="entrySimbolos" value="${entry?.simbolos || ''}"></div>
                    <div class="form-group"><label class="form-label">Rituais</label><textarea class="form-textarea" id="entryRituais">${entry?.rituais || ''}</textarea></div>
                `;
            } else if (cat === 'properties') {
                // Get available NPCs from data
                const availableNpcs = allData.npcs || [];

                extraFields = `
                    <div class="form-group"><label class="form-label">Título da Propriedade</label><input type="text" class="form-input" id="entryTitulo" value="${entry?.titulo || ''}" placeholder="Ex: Taverna do Dragão Bêbado, Castelo das Sombras..."></div>
                    <div class="form-group"><label class="form-label">Localização</label><input type="text" class="form-input" id="entryLocalizacao" value="${entry?.localizacao || ''}" placeholder="Ex: Centro da cidade, Floresta Negra..."></div>
                    <div class="form-group"><label class="form-label">Proprietário</label><input type="text" class="form-input" id="entryProprietario" value="${entry?.proprietario || ''}" placeholder="Ex: Lorde Aldric, Família Stoneheart..."></div>
                    <div class="form-group"><label class="form-label">Valor Estimado</label><input type="text" class="form-input" id="entryValor" value="${entry?.valor || ''}" placeholder="Ex: 5.000 moedas de ouro..."></div>
                    <div class="form-group">
                        <label class="form-label">Estado de Conservação</label>
                        <select class="form-select" id="entryEstado">
                            <option value="Conservada" ${(entry?.estado || '') === 'Conservada' ? 'selected' : ''}>Conservada</option>
                            <option value="Deteriorada" ${(entry?.estado || '') === 'Deteriorada' ? 'selected' : ''}>Deteriorada</option>
                            <option value="Abandonada" ${(entry?.estado || '') === 'Abandonada' ? 'selected' : ''}>Abandonada</option>
                            <option value="Em Ruínas" ${(entry?.estado || '') === 'Em Ruínas' ? 'selected' : ''}>Em Ruínas</option>
                        </select>
                    </div>
                    <div class="form-group"><label class="form-label">Tamanho</label><input type="text" class="form-input" id="entryTamanho" value="${entry?.tamanho || ''}" placeholder="Ex: Grande, 200m², 3 andares..."></div>
                    <div class="form-group" style="grid-column: 1/-1;"><label class="form-label">Cômodos/Áreas</label><textarea class="form-textarea" id="entryComodos" rows="3" placeholder="Descrição dos ambientes internos...">${entry?.comodos || ''}</textarea></div>
                    <div class="form-group" style="grid-column: 1/-1;"><label class="form-label">Segredos</label><textarea class="form-textarea" id="entrySegredos" rows="3" placeholder="Passagens secretas, tesouros escondidos...">${entry?.segredos || ''}</textarea></div>
                `;

                // NPC linking section for properties
                geographySections = `
                <div class="form-section">
                    <h3 class="form-section-title">👥 NPCs nesta Propriedade</h3>
                    <div class="linked-entities-list" id="linkedNpcsPropertyList"></div>
                    <div class="add-linked-entity">
                        <select class="form-select" id="selectNpcToLinkProperty">
                            <option value="">Selecionar NPC...</option>
                            ${availableNpcs.map(n => `<option value="${n.id}" data-name="${n.nome}" data-type="${n.tipo || 'NPC'}">${n.nome} (${n.tipo || 'NPC'})</option>`).join('')}
                        </select>
                        <button type="button" onclick="addLinkedNpcProperty()">+ Adicionar</button>
                    </div>
                </div>
                <div class="form-section">
                    <h3 class="form-section-title">📦 Itens Disponíveis</h3>
                    <div class="linked-entities-list" id="linkedItemsList"></div>
                    <div class="add-linked-entity">
                        <select class="form-select" id="selectItemToLink">
                            <option value="">Selecionar Item...</option>
                            ${allItems.map(item => `<option value="${item.id}" data-name="${item.name || 'Item'}">${item.name || 'Item'} (${item.type || 'Item'})</option>`).join('')}
                        </select>
                        <button type="button" onclick="addLinkedItem()">+ Adicionar</button>
                    </div>
                </div>
                `;
            }

            body.innerHTML = `
                <div class="form-section">
                    <h3 class="form-section-title">📋 Informações Básicas</h3>

                data.dataFim = document.getElementById('entryDataFim')?.value?.trim() || '';

                data.estruturaSocial = document.getElementById('entryEstruturaSocial')?.value?.trim() || '';
                data.idiomas = document.getElementById('entryIdiomas')?.value?.trim() || '';
            } else if (cat === 'magic') {

                data.limitacoes = document.getElementById('entryLimitacoes')?.value?.trim() || '';

                data.rituais = document.getElementById('entryRituais')?.value?.trim() || '';

            try {

                                               data-playername="${p.jogador || ''}"
                                               checked>
                                        <div class="player-checkbox-info">
                                            <span class="player-checkbox-char">${p.nome || 'Personagem'}</span>
                                            <span class="player-checkbox-name">👤 ${p.jogador || 'Jogador'}</span>
