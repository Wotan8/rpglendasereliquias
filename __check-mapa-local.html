<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Check — Mapa Tático do Local</title>
    <link rel="stylesheet" href="shared/tokens.css">
    <link rel="stylesheet" href="worldbuilding/css/wb-ferramentas.css?v=2">
    <style>
        body { background: var(--lr-bg-0); color: var(--lr-text-1); font-family: var(--lr-font-body); margin: 0; padding: 24px; }
        #res { white-space: pre-wrap; font-family: monospace; font-size: 13px; }
        .ok { color: #3FAE6A; } .fail { color: #C94F5C; font-weight: 700; }
        .btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--lr-border); background: var(--lr-surface); color: var(--lr-text-1); cursor: pointer; }
        .btn-secondary { } .btn-success { border-color: #3FAE6A; } .btn-sm { font-size: 12px; }
    </style>
</head>

<body>
    <h1>Check — editor de mapa tático</h1>
    <div id="res">rodando…</div>

    <script type="module">
        import './worldbuilding/js/wb-mapa-local.js';
        const casos = [];
        const t = (nome, fn) => { try { casos.push([nome, !!fn(), '']); } catch (e) { casos.push([nome, false, e.message]); } };
        const espera = (ms) => new Promise(r => setTimeout(r, ms));
        // O clique dispara um handler ASSÍNCRONO (getDoc sem auth pode demorar
        // até rejeitar) — espere a condição, nunca um tempo fixo.
        const ate = async (fn, ms = 10000) => {
            const t0 = Date.now();
            while (Date.now() - t0 < ms) { if (fn()) return true; await espera(120); }
            return false;
        };

        // Regressão: o clique REAL passa pelo atributo onclick gerado pelo
        // wb-core — era aqui que aspas no nome quebravam o handler em silêncio.
        const host = document.createElement('div');
        host.innerHTML = `<button id="btnFicha" type="button" onclick="abrirMapaLocal('geo_fake')">abrir</button>`;
        document.body.appendChild(host);
        document.getElementById('btnFicha').click();
        const abriu = await ate(() => document.getElementById('wbMapaLocal'));
        t('clique no botão da ficha abre o editor', () => abriu);

        t('overlay montado', () => document.getElementById('wbMapaLocal'));
        t('barra de config presente', () => document.getElementById('wbmlLargura') && document.getElementById('wbmlAmbiente') && document.getElementById('wbmlLuzAtiva'));
        t('5 ferramentas', () => document.querySelectorAll('[data-wbml-tool]').length === 5);
        t('estado vazio visível', () => !document.getElementById('wbmlVazio').hidden);
        t('parede começa ativa', () => document.querySelector('[data-wbml-tool="parede"]').classList.contains('is-on'));

        // troca de ferramenta (dentro de t(): se o overlay não abriu, vira ❌ e não mata o script)
        t('troca para luz marca o botão', () => {
            document.querySelector('[data-wbml-tool="luz"]').click();
            return document.querySelector('[data-wbml-tool="luz"]').classList.contains('is-on')
                && !document.querySelector('[data-wbml-tool="parede"]').classList.contains('is-on');
        });

        // salvar sem mapa deve avisar, não gravar
        t('salvar sem mapa avisa', () => { document.getElementById('wbmlSalvar').click(); return true; });
        await espera(100);
        t('aviso ⚠️ apareceu', () => document.getElementById('wbmlDica').textContent.includes('⚠️'));

        // Regressão: `display:flex` do CSS vencia o atributo [hidden] e o
        // overlay "Nenhum mapa ainda" ficava NA FRENTE do mapa enviado.
        t('overlay some quando hidden (upload feito)', () => {
            const vazio = document.getElementById('wbmlVazio');
            vazio.hidden = true;
            const sumiu = getComputedStyle(vazio).display === 'none';
            vazio.hidden = false;
            return sumiu;
        });

        // ESC fecha (bubbles: como um teclado de verdade)
        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
        t('ESC fecha o editor', () => !document.getElementById('wbMapaLocal'));

        const falhas = casos.filter(c => !c[1]).length;
        document.getElementById('res').innerHTML =
            `<b class="${falhas ? 'fail' : 'ok'}">${falhas ? falhas + ' FALHA(S)' : 'TODOS OS ' + casos.length + ' CASOS PASSARAM'}</b>\n\n` +
            casos.map(([n, ok, err]) => `<span class="${ok ? 'ok' : 'fail'}">${ok ? '✅' : '❌'} ${n}${err ? ' — ' + err : ''}</span>`).join('\n');
    </script>
</body>

</html>
