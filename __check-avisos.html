<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check — Caixa de Avisos do Mestre</title>

<!-- Mesmos arquivos e MESMA ORDEM do painel-mestre.html. Sem isso o check
     mente: o problema anterior desta janela foi justamente CSS. -->
<link rel="stylesheet" href="painel-mestre/css/base.css">
<link rel="stylesheet" href="painel-mestre/css/layout.css">
<link rel="stylesheet" href="painel-mestre/css/tabs.css">
<link rel="stylesheet" href="painel-mestre/css/modais.css">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/lendas-reliquias.css">
<link rel="stylesheet" href="shared/dialogo.css">
<script type="module">import './shared/lr-icones.js';</script>

<style>
  .chk-bar { position: fixed; top:0; left:0; right:0; z-index: 9999;
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      padding:8px 12px; background: var(--lr-bg-1);
      border-bottom: 1px solid var(--lr-border);
      font: 600 .82rem/1.4 var(--lr-font-body); color: var(--lr-text-1); }
  .chk-bar button { padding:4px 10px; border:1px solid var(--lr-border);
      border-radius:6px; background: var(--lr-surface); color: var(--lr-text-1); font:inherit; }
  .chk-stage { padding: 56px 16px 16px; max-width: 1000px; margin: 0 auto; }
  #chkLog { white-space: pre-wrap; font: 12px/1.7 ui-monospace, monospace;
      color: var(--lr-text-2); background: var(--lr-bg-1);
      border: 1px solid var(--lr-border); border-radius: 8px; padding: 12px; margin-top: 14px; }
</style>
</head>
<body>

<div class="chk-bar">
  <strong>Check — Caixa de Avisos</strong>
  <button onclick="document.documentElement.classList.toggle('dark')">Alternar tema</button>
  <button onclick="abrirAvisos()">Abrir a caixa</button>
  <button onclick="chkClicar()">Clicar em TODOS os botoes</button>
  <span id="chkResumo"></span>
</div>

<div class="chk-stage">
  <p>Monta a caixa de Avisos com o markup e o CSS <b>reais</b> e clica em cada
  botao de verdade: <code>elementFromPoint</code> no centro dele, para pegar
  overlay invisivel por cima, e um <code>click()</code> para ver se o handler roda.</p>

  <!-- A barra da mesa, com o botao de Avisos onde ele vive de verdade -->
  <div class="mesa-header-bar">
    <button class="btn btn-secondary btn-small">Mesas</button>
    <h2 style="font-size:1.1rem;font-weight:800;color:var(--primary);margin:0">Bugigangas</h2>
    <div class="mesa-ajustes">
      <button class="mesa-ajuste-btn mesa-ajuste-avisos" id="btnAvisos" onclick="abrirAvisos()">
        <svg class="lr-ico"><use href="#i-megafone"/></svg> Avisos
        <span id="avisosBadge" class="avisos-badge">2</span></button>
      <button class="mesa-ajuste-btn" id="btnMesaDensidade">Confortavel</button>
    </div>
  </div>

  <div id="chkLog">Clique em "Clicar em TODOS os botoes".</div>
</div>

<script type="module" src="__check-avisos.js"></script>
</body>
</html>
