<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lendas e Relíquias - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--lr-bg-0) 0%, var(--lr-surface) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(31, 38, 48, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(91, 63, 184, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: var(--lr-abyssal);
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .subtitle {
            text-align: center;
            color: var(--lr-text-2);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--lr-text-2);
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 14px;
            background: rgba(14, 17, 23, 0.8);
            border: 2px solid var(--lr-surface-2);
            border-radius: 10px;
            color: var(--lr-divine);
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--lr-abyssal);
            box-shadow: 0 0 0 3px rgba(91, 63, 184, 0.2);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--lr-abyssal), var(--lr-abyssal-2));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(91, 63, 184, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(51, 65, 85, 0.6);
            border: 2px solid var(--lr-surface-2);
        }

        .toggle-form {
            text-align: center;
            margin-top: 20px;
            color: var(--lr-text-2);
            font-size: 0.9rem;
        }

        .toggle-form a {
            color: var(--lr-abyssal);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .toggle-form a:hover {
            color: var(--lr-abyssal-2);
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            display: none;
        }

        .alert-success {
            background: rgba(63, 174, 106, 0.2);
            border: 2px solid var(--lr-nature);
            color: var(--lr-nature);
        }

        .alert-danger {
            background: rgba(201, 79, 92, 0.2);
            border: 2px solid var(--lr-blood-2);
            color: var(--lr-blood-2);
        }

        .alert-warning {
            background: rgba(212, 175, 55, 0.2);
            border: 2px solid var(--lr-gold);
            color: var(--lr-gold);
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--lr-abyssal);
            margin-top: 10px;
            font-weight: 600;
        }

        #cadastroForm {
            display: none;
        }

        /* SELETOR DE ROLE */
        .role-selector {
            margin: 20px 0;
            padding: 15px;
            background: rgba(91, 63, 184, 0.1);
            border: 2px solid var(--lr-abyssal);
            border-radius: 10px;
        }

        .role-option {
            display: flex;
            align-items: center;
            padding: 12px;
            margin: 8px 0;
            background: rgba(14, 17, 23, 0.6);
            border: 2px solid var(--lr-surface-2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .role-option:hover {
            border-color: var(--lr-abyssal);
            background: rgba(91, 63, 184, 0.15);
        }

        .role-option.selected {
            border-color: var(--lr-abyssal);
            background: rgba(91, 63, 184, 0.2);
        }

        .role-option input[type="radio"] {
            width: auto;
            margin-right: 12px;
            cursor: pointer;
        }

        .role-info {
            flex: 1;
        }

        .role-title {
            font-weight: 700;
            color: var(--lr-divine);
            margin-bottom: 3px;
            font-size: 1rem;
        }

        .role-desc {
            color: var(--lr-text-2);
            font-size: 0.8rem;
        }

        /* CAMPO DE CÓDIGO SECRETO */
        .master-code-field {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid var(--lr-gold);
            border-radius: 10px;
            animation: slideDown 0.3s ease;
        }

        .master-code-field.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .code-info {
            color: var(--lr-gold);
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 600;
        }

        @media (max-width: 500px) {
            .login-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
<script type="module" src="/js/global-favicon.js"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0E1117">
    <!-- Design System — Lendas & Relíquias (ver DESIGN-SYSTEM.md) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="shared/tokens.css">
    <link rel="stylesheet" href="shared/lendas-reliquias.css">
</head>
<body>
    <div class="login-container">
        <div class="logo">⚔️</div>
        <h1>LENDAS E RELÍQUIAS</h1>
        <p class="subtitle">Sistema de Fichas RPG</p>

        <div class="alert alert-success" id="alertSuccess"></div>
        <div class="alert alert-danger" id="alertError"></div>
        <div class="alert alert-warning" id="alertWarning"></div>

        <!-- FORMULÁRIO DE LOGIN -->
        <form id="loginForm">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label>🔒 Senha</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">ENTRAR</button>
            <div class="toggle-form">
                Não tem conta? <a onclick="toggleForm()">Cadastre-se aqui</a>
            </div>
        </form>

        <!-- FORMULÁRIO DE CADASTRO -->
        <form id="cadastroForm">
            <div class="form-group">
                <label>👤 Nome do Jogador</label>
                <input type="text" id="cadastroNome" placeholder="Seu nome completo" required>
            </div>
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="cadastroEmail" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label>🔒 Senha</label>
                <input type="password" id="cadastroPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <div class="form-group">
                <label>🔒 Confirmar Senha</label>
                <input type="password" id="cadastroPasswordConfirm" placeholder="Digite a senha novamente" required>
            </div>

            <!-- SELETOR DE ROLE -->
            <div class="role-selector">
                <label style="margin-bottom: 12px; display: block; text-align: center;">
                    👤 Escolha seu tipo de conta:
                </label>
                
                <label class="role-option selected" id="roleJogador">
                    <input type="radio" name="role" value="jogador" checked onchange="toggleMasterCode()">
                    <div class="role-info">
                        <div class="role-title">🎭 Jogador</div>
                        <div class="role-desc">Crie e gerencie seu personagem</div>
                    </div>
                </label>

                <label class="role-option" id="roleMestre">
                    <input type="radio" name="role" value="mestre" onchange="toggleMasterCode()">
                    <div class="role-info">
                        <div class="role-title">👑 Mestre</div>
                        <div class="role-desc">Veja e monitore todos os jogadores</div>
                    </div>
                </label>
            </div>

            <!-- CAMPO DE CÓDIGO SECRETO DO MESTRE -->
            <div class="master-code-field" id="masterCodeField">
                <div class="code-info">🔐 Digite o código secreto do Mestre:</div>
                <div class="form-group">
                    <input type="password" id="masterCode" placeholder="Código fornecido pelo administrador" autocomplete="off">
                </div>
                <div style="font-size: 0.75rem; color: var(--lr-text-2); text-align: center; margin-top: 5px;">
                    Apenas quem possui o código pode ser Mestre
                </div>
            </div>

            <button type="submit" class="btn">CRIAR CONTA</button>
            <div class="toggle-form">
                Já tem conta? <a onclick="toggleForm()">Fazer login</a>
            </div>
        </form>

        <div class="loading" id="loading">⏳ Carregando...</div>
    </div>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ============= CONFIGURAÇÃO =============
        // 🔐 ALTERE ESTE CÓDIGO PARA O SEU CÓDIGO SECRETO DE MESTRE
        const MASTER_SECRET_CODE = "MESTRE5253";
        // ========================================

        // Configuração do Firebase
        // Your web app's Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyA6r79XcsMr3KZUT1YZ8vQntIGspgULXcE",
          authDomain: "rpg-lendasereliquias.firebaseapp.com",
          projectId: "rpg-lendasereliquias",
          storageBucket: "rpg-lendasereliquias.firebasestorage.app",
          messagingSenderId: "546994339773",
          appId: "1:546994339773:web:0116cf7c8667f113075cd4"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        // 💾 PERSISTÊNCIA OFFLINE (Firebase v10+): cache local em IndexedDB.
        // Leituras funcionam offline e escritas ficam na fila e sincronizam
        // automaticamente quando a conexão voltar. Multi-tab habilitado.
        let db;
        try {
            db = initializeFirestore(app, {
                localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
            });
            console.log('💾 Firestore: cache offline (IndexedDB) ativado.');
        } catch (e) {
            console.warn('💾 Firestore: cache offline indisponível, usando memória.', e);
            db = getFirestore(app);
        }

        // Funções auxiliares
        function showAlert(message, type) {
            const alerts = {
                success: document.getElementById('alertSuccess'),
                danger: document.getElementById('alertError'),
                warning: document.getElementById('alertWarning')
            };
            
            // Esconder todos os alertas
            Object.values(alerts).forEach(alert => alert.style.display = 'none');
            
            const alert = alerts[type];
            if (alert) {
                alert.textContent = message;
                alert.style.display = 'block';
                
                setTimeout(() => {
                    alert.style.display = 'none';
                }, 5000);
            }
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // Toggle entre Login e Cadastro
        window.toggleForm = function() {
            const loginForm = document.getElementById('loginForm');
            const cadastroForm = document.getElementById('cadastroForm');
            
            // Esconder alertas
            document.getElementById('alertSuccess').style.display = 'none';
            document.getElementById('alertError').style.display = 'none';
            document.getElementById('alertWarning').style.display = 'none';
            
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                cadastroForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                cadastroForm.style.display = 'block';
            }
        }

        // Toggle campo de código do mestre
        window.toggleMasterCode = function() {
            const roleInput = document.querySelector('input[name="role"]:checked');
            const masterCodeField = document.getElementById('masterCodeField');
            const roleJogador = document.getElementById('roleJogador');
            const roleMestre = document.getElementById('roleMestre');
            
            // Atualizar visual das opções
            roleJogador.classList.remove('selected');
            roleMestre.classList.remove('selected');
            
            if (roleInput.value === 'mestre') {
                masterCodeField.classList.add('show');
                roleMestre.classList.add('selected');
            } else {
                masterCodeField.classList.remove('show');
                roleJogador.classList.add('selected');
            }
        }

        // FUNÇÃO PARA REDIRECIONAR BASEADO NA ROLE
        async function redirectBasedOnRole(user) {
            try {
                const userDoc = doc(db, 'users', user.uid);
                const docSnap = await getDoc(userDoc);
                
                if (docSnap.exists()) {
                    const userData = docSnap.data();
                    const role = userData.role;
                    
                    // Salvar dados no localStorage
                    localStorage.setItem('userUID', user.uid);
                    localStorage.setItem('userEmail', user.email);
                    localStorage.setItem('userName', user.displayName || 'Jogador');
                    localStorage.setItem('userRole', role);
                    
                    localStorage.setItem('authConfirmed', 'true');
                    localStorage.setItem('authTimestamp', Date.now().toString());

                    console.log('✅ Role do usuário:', role);
                    
                    // Redirecionar baseado na role
                    if (role === 'mestre') {
                        console.log('👑 Redirecionando para painel do mestre...');
                        window.location.href = 'painel-mestre/painel-mestre.html';
                    } else {
                        console.log('🎭 Redirecionando para ficha do jogador...');
                        window.location.href = 'menu/menu.html';
                    }
                } else {
                    // Se não encontrar o documento, assumir jogador (para contas antigas)
                    console.warn('⚠️ Documento de usuário não encontrado. Criando como jogador...');
                    await setDoc(doc(db, 'users', user.uid), {
                        email: user.email,
                        role: 'jogador',
                        createdAt: new Date().toISOString()
                    });
                    
                    localStorage.setItem('userUID', user.uid);
                    localStorage.setItem('userEmail', user.email);
                    localStorage.setItem('userName', user.displayName || 'Jogador');
                    localStorage.setItem('userRole', 'jogador');

                    localStorage.setItem('authConfirmed', 'true');
                    localStorage.setItem('authTimestamp', Date.now().toString());
                    
                    window.location.href = 'menu/menu.html';
                }
            } catch (error) {
                console.error('❌ Erro ao verificar role:', error);
                showAlert('Erro ao carregar dados do usuário.', 'danger');
            }
        }

        // LOGIN
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            showLoading(true);
            
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                showAlert('✅ Login realizado com sucesso!', 'success');
                
                console.log('✅ Usuário logado:', userCredential.user.email);
                
                // Aguardar um momento antes de redirecionar
                setTimeout(async () => {
                    await redirectBasedOnRole(userCredential.user);
                }, 1000);
                
            } catch (error) {
                console.error('Erro no login:', error);
                
                let errorMsg = '❌ Erro ao fazer login. ';
                if (error.code === 'auth/user-not-found') {
                    errorMsg += 'Usuário não encontrado.';
                } else if (error.code === 'auth/wrong-password') {
                    errorMsg += 'Senha incorreta.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg += 'Email inválido.';
                } else if (error.code === 'auth/invalid-credential') {
                    errorMsg += 'Email ou senha incorretos.';
                } else {
                    errorMsg += error.message;
                }
                
                showAlert(errorMsg, 'danger');
                showLoading(false);
            }
        });

        // CADASTRO
        document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nome = document.getElementById('cadastroNome').value;
            const email = document.getElementById('cadastroEmail').value;
            const password = document.getElementById('cadastroPassword').value;
            const passwordConfirm = document.getElementById('cadastroPasswordConfirm').value;
            const roleInput = document.querySelector('input[name="role"]:checked');
            const role = roleInput ? roleInput.value : 'jogador';
            
            // Validar senhas
            if (password !== passwordConfirm) {
                showAlert('❌ As senhas não coincidem!', 'danger');
                return;
            }
            
            if (password.length < 6) {
                showAlert('❌ A senha deve ter pelo menos 6 caracteres!', 'danger');
                return;
            }

            // 🔐 VALIDAR CÓDIGO DO MESTRE
            if (role === 'mestre') {
                const masterCode = document.getElementById('masterCode').value;
                
                if (!masterCode) {
                    showAlert('❌ Digite o código secreto do Mestre!', 'danger');
                    return;
                }
                
                if (masterCode !== MASTER_SECRET_CODE) {
                    showAlert('❌ Código do Mestre incorreto! Apenas o administrador possui este código.', 'danger');
                    return;
                }
                
                console.log('✅ Código do Mestre validado!');
            }
            
            showLoading(true);
            
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                
                console.log('✅ Conta criada:', userCredential.user.email);
                console.log('👤 Role selecionado:', role);
                
                // Atualizar perfil com o nome
                await updateProfile(userCredential.user, {
                    displayName: nome
                });
                
                // Salvar role do usuário no Firestore
                await setDoc(doc(db, 'users', userCredential.user.uid), {
                    email: userCredential.user.email,
                    displayName: nome,
                    role: role,
                    createdAt: new Date().toISOString()
                });
                
                console.log('✅ Role salvo no Firestore');
                
                if (role === 'mestre') {
                    showAlert('✅ Conta de MESTRE criada com sucesso! 👑', 'success');
                } else {
                    showAlert('✅ Conta criada com sucesso!', 'success');
                }
                
                // Aguardar um momento antes de redirecionar
                setTimeout(async () => {
                    await redirectBasedOnRole(userCredential.user);
                }, 1000);
                
            } catch (error) {
                console.error('Erro no cadastro:', error);
                
                let errorMsg = '❌ Erro ao criar conta. ';
                if (error.code === 'auth/email-already-in-use') {
                    errorMsg += 'Este email já está cadastrado.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg += 'Email inválido.';
                } else if (error.code === 'auth/weak-password') {
                    errorMsg += 'Senha muito fraca.';
                } else {
                    errorMsg += error.message;
                }
                
                showAlert(errorMsg, 'danger');
                showLoading(false);
            }
        });

        // Adicionar estilo de seleção visual nos radio buttons
        document.querySelectorAll('.role-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.role-option').forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
            });
        });
    </script>
</body>
</html>
