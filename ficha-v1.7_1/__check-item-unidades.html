<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__check: unidade adaptativa — g/cm abaixo de 1, kg/m com vírgula acima</title>
<link rel="stylesheet" href="../shared/sanfona.css">
<link rel="stylesheet" href="../shared/dialogo.css?v=2">
<script type="module">import '../shared/dialogo.js?v=2';</script>
<link rel="stylesheet" href="css/styles_v2.css">
<link rel="stylesheet" href="css/inventory.css">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/lendas-reliquias.css">
<style>
    body { padding: 16px; }
    #out { font: 12px/1.5 monospace; white-space: pre-wrap; background: #101418; color: #9f9;
           padding: 10px; border-radius: 6px; }
</style>

<div id="out">carregando…</div>

<script>
    const T = Date.now();
    document.querySelectorAll('link[rel=stylesheet]').forEach(l => {
        l.href = l.getAttribute('href').split('?')[0] + '?t=' + T;
    });
    /* O inventário da ficha é script clássico e enorme; aqui interessam só os
       dois formatadores e o formulário. O resto do arquivo é carregado igual
       para garantir que estamos medindo o código de verdade. */
    window.state = { dots: {}, items: [] };
    window.isMestre = false; window.isCreator = false;
    function scheduleAutosave() {}
</script>
<script>
    document.write('<scr' + 'ipt src="js/inventory.js?t=' + T + '"><\/scr' + 'ipt>');
</script>
<script>
    const linhas = [];

    // 1. Os formatadores, com os tamanhos que a mesa usa de verdade.
    const casos = [
        ['adaga',        0.3],
        ['10 cm',        0.1],
        ['espada 1,20m', 1.2],
        ['inteiro',      1],
        ['float sujo',   0.1 + 0.2],
    ];
    linhas.push('TAMANHO (m)');
    for (const [nome, v] of casos) linhas.push(`  ${nome.padEnd(14)} ${v} → ${_tamanhoM(v)}`);
    linhas.push('PESO (kg)');
    for (const v of [0.5, 1, 2.25, undefined]) linhas.push(`  ${String(v).padEnd(14)} → ${_pesoKg(v)}`);

    // A régua fechada na tarefa 1 do balanceamento: < 1 desce a unidade,
    // ≥ 1 fica em kg/m com vírgula pt-BR e sem zeros à direita.
    if (_tamanhoM(0.1) !== '10 cm') linhas.push('⚠️ 0,1 m devia virar "10 cm": ' + _tamanhoM(0.1));
    if (_tamanhoM(0.3) !== '30 cm') linhas.push('⚠️ 0,3 m devia virar "30 cm": ' + _tamanhoM(0.3));
    if (_tamanhoM(0.1 + 0.2) !== '30 cm') linhas.push('⚠️ float sujo devia virar "30 cm": ' + _tamanhoM(0.1 + 0.2));
    if (_tamanhoM(1.2) !== '1,2 m') linhas.push('⚠️ 1,2 m devia usar vírgula: ' + _tamanhoM(1.2));
    if (_pesoKg(0.035) !== '35 g') linhas.push('⚠️ 35 g não pode virar "0.04 kg": ' + _pesoKg(0.035));
    if (_pesoKg(0.5) !== '500 g') linhas.push('⚠️ 0,5 kg devia virar "500 g": ' + _pesoKg(0.5));
    if (_pesoKg(1.25) !== '1,25 kg') linhas.push('⚠️ 1,25 kg com vírgula: ' + _pesoKg(1.25));
    if (_pesoKg(2) !== '2 kg') linhas.push('⚠️ 2 kg sem zeros à direita: ' + _pesoKg(2));

    // 2. O formulário aceita fração e anuncia a unidade.
    document.body.insertAdjacentHTML('beforeend', '<div id="formHost" style="display:none"></div>');
    try {
        const host = document.getElementById('formHost');
        host.innerHTML = typeof _invFormHTML === 'function' ? _invFormHTML() : '';
    } catch (e) { /* o form vive dentro do modal; testado pelo DOM abaixo */ }

    linhas.push('');
    linhas.push('FORMULÁRIO (a spec compartilhada é quem desenha os campos)');
    /* O formulário da ficha deixou de ser escrito à mão: hoje é
       shared/equip-campos.js, o mesmo do Painel do Criador. Então o que se
       confere aqui é a SPEC — se ela desenhar peso/tamanho como number de step
       livre, as quatro telas ganham juntas. */
    Promise.all([
        import('../shared/equip-campos.js?v=17'),
        fetch('js/inventory.js?t=' + T).then(r => r.text()),
    ]).then(([EC, src]) => {
        const host = document.createElement('div');
        for (const key of ['tamanho', 'peso']) {
            const f = EC.CAMPOS_EQUIPAMENTO.find(x => x.key === key);
            host.innerHTML = EC.htmlCampo(f, null, { sel: {}, caches: {} });
            const el = host.querySelector('#field_' + key);
            const step = el?.getAttribute('step');
            const ok = el?.type === 'number' && step && step !== '1';
            linhas.push(`  field_${key.padEnd(10)} type=${el?.type || '—'} · step=${step || 'NÃO'} ${ok ? '' : '⚠️'}`);
            linhas.push(`      placeholder: ${f.placeholder || 'NÃO ⚠️'}`);
        }
        const parseInts = src.split('\n')
            .map((l, n) => [n + 1, l])
            .filter(([, l]) => /parseInt\s*\(\s*(document\.getElementById\('invForm(Tamanho|Peso)|item\.(tamanho|peso))/.test(l));
        linhas.push(`  parseInt em peso/tamanho: ${parseInts.length ? '⚠️ ' + parseInts.map(([n]) => n).join(', ') : 'nenhum'}`);
        document.getElementById('out').textContent = linhas.join('\n');
    });
</script>
