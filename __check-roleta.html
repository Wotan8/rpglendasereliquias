<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancada — Roleta dos Apoiadores</title>
    <!-- As mesmas folhas do index.html, na mesma ordem. lendas-reliquias.css
         faltava aqui: e ele que desenha botao, campo e <dialog> do projeto, e
         sem ele a bancada media um Portal sem metade da roupa. -->
    <link rel="stylesheet" href="/shared/dialogo.css?v=3">
    <link rel="stylesheet" href="/menu/css/menu.css?v=43">
    <link rel="stylesheet" href="/shared/tokens.css?v=11">
    <link rel="stylesheet" href="/shared/lendas-reliquias.css?v=2">
    <!-- Quebra-cache: sem isto o navegador servia a folha ANTIGA e a bancada
         dava verde para CSS que nem estava no arquivo. Descoberto tentando
         reintroduzir um defeito de propósito e vendo o teste passar mesmo
         assim — um guarda que não morde é pior que nenhum. -->
    <script>
        for (const l of document.querySelectorAll('link[rel=stylesheet]'))
            l.href = l.href.replace(/[?&]cb=\d+/, '') + (l.href.includes('?') ? '&' : '?') + 'cb=' + Date.now();
    </script>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; background: var(--lr-bg-0); color: var(--lr-text-1); }
        #saida { font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.7; white-space: pre-wrap; }
        .ok { color: #16a34a; } .falha { color: #dc2626; font-weight: 700; }
        .pulado { color: #a16207; }
        button.acao { margin: 4px 6px 12px 0; padding: 8px 14px; cursor: pointer; }
    </style>
</head>

<body>
    <h1 style="font-size:1.1rem">Bancada — Roleta dos Apoiadores</h1>
    <p style="color:var(--lr-text-2);font-size:.9rem;max-width:70ch">
        Confere o que não precisa de servidor: geometria das fatias contra o desenho, legenda,
        layout responsivo e o estado do botão. O sorteio em si é do servidor e tem teste próprio
        em <code>functions/roleta-sorteio.test.mjs</code>.
    </p>

    <button class="acao" onclick="rodar()">▶ Rodar conferência</button>
    <button class="acao" onclick="window.abrirRoleta()">👁 Só abrir a janela</button>
    <div id="saida">…</div>

    <script type="module" src="/shared/dialogo.js?v=2"></script>
    <script type="module">
        import { fatias, fatiaSobASeta, rotacaoFinal, fatiaNoPonto, minimoDeFatia } from '/shared/roleta-geometria.js?v=3';
        import { curvaGiro } from '/shared/roleta-curva.js?v=3';

        // As 37 chances reais do documento de mesa, incluindo as de 0,3%
        const CHANCES = [1, 1, 1, 3, 3, 3, 3, 5, 3, 5, 5, 1, 3, 3, 3, 3, 3, 5, 5, 3, 5, 3, 3, 1, 1, 1,
            0.5, 3, 3, 3, 3, 5, 1, 1, 0.5, 0.3, 0.09];

        window.__roletaBancada = {
            premios: CHANCES.map((chance, i) => ({
                itemId: 'fake' + i, chance,
                nome: ['Lunis x250', 'Lunis x500', 'Lunis x800', 'EXP 3', 'EXP 4', 'Re-roleta 1x',
                    'Vale-Compra 20%', 'Informação x1', 'Recurso Comum x10', 'Benção Menor'][i] || ('Prêmio ' + (i + 1)),
            })),
            itensDeGiro: [
                { id: 'g1', nome: 'Roleta 1x', roletaGiros: 1, valorFrag: 10, valorReal: 1000 },
                { id: 'g3', nome: 'Roleta 3x', roletaGiros: 3, valorFrag: 25, valorReal: 2000 },
            ],
            descricoes: { fake7: 'Uma pista forte que destrava um objetivo.' },
        };

        let ok = 0, falhou = 0, pulados = 0;
        const linhas = [];
        const conferir = (nome, condicao, detalhe = '') => {
            if (condicao) { ok++; linhas.push(`<span class="ok">✔</span> ${nome}`); }
            else { falhou++; linhas.push(`<span class="falha">✘ ${nome}${detalhe ? ' — ' + detalhe : ''}</span>`); }
        };
        const pular = (nome, motivo) => {
            pulados++;
            linhas.push(`<span class="pulado">— ${nome} · PULADO: ${motivo}</span>`);
        };

        /* ONDE ESTA BANCADA ESTA RODANDO PODE NAO HAVER QUADRO NEM LAYOUT.
           Num painel embutido ou oculto o navegador congela as duas coisas: o
           `requestAnimationFrame` nunca dispara e o `getBoundingClientRect`
           devolve a medida da ultima composicao, dentro da MESMA tarefa de
           script. Guarda que falha por motivo alheio ensina todo mundo a
           ignorar guarda; e guarda que PASSA sem medir nada e pior ainda,
           porque aprova o vazio. Entao as duas coisas sao sondadas e o que
           depende delas sai como PULADO, com o motivo escrito e contado a
           parte no placar. Em navegador de verdade as sondas passam e tudo
           roda como sempre. */
        const layoutVivo = () => {
            const sonda = document.createElement('div');
            sonda.style.cssText = 'position:absolute;visibility:hidden;width:10px';
            document.body.appendChild(sonda);
            sonda.style.height = '100px';
            const a = sonda.getBoundingClientRect().height;
            sonda.style.height = '500px';
            const b = sonda.getBoundingClientRect().height;
            sonda.remove();
            return a === 100 && b === 500;
        };
        const quadrosVivos = () => new Promise(resolve => {
            let veio = false;
            requestAnimationFrame(() => { veio = true; });
            setTimeout(() => resolve(veio), 250);
        });

        /* Varre o CODIGO, sem os comentarios. A primeira versao destes testes
           acusava `crossOrigin` e `getImageData` no hero: o comentario que
           EXPLICA a ausencia deles cita os dois pelo nome, e o guarda mordia a
           propria explicacao. */
        const semComentarios = (txt) => txt
            .replace(/\/\*[\s\S]*?\*\//g, ' ')
            .replace(/(^|[^:])\/\/[^\n]*/g, '$1 ');

        window.rodar = async function () {
            ok = 0; falhou = 0; pulados = 0; linhas.length = 0;
            const saida = document.getElementById('saida');
            const temLayout = layoutVivo();
            const temQuadros = await quadrosVivos();

            await window.abrirRoleta();
            const dialogo = document.querySelector('dialog.lr-roleta');
            conferir('a janela abriu', dialogo && dialogo.open);

            // --- desenho ---
            const canvas = document.getElementById('roletaCanvas');
            conferir('o canvas existe', !!canvas);
            conferir('o canvas é quadrado', canvas && canvas.width === canvas.height,
                canvas ? `${canvas.width}x${canvas.height}` : '');
            conferir('o canvas tem pixel de verdade (não ficou 0)', canvas && canvas.width > 100, canvas?.width);

            // pinta? amostra o centro-topo, onde a agulha fica
            if (canvas) {
                const ctx = canvas.getContext('2d');
                const px = ctx.getImageData(canvas.width / 2, canvas.height * 0.12, 1, 1).data;
                conferir('a roda foi pintada (pixel não transparente)', px[3] > 0, `alpha=${px[3]}`);
            }

            // --- legenda ---
            const itensLegenda = document.querySelectorAll('#roletaLegenda li');
            conferir('a legenda lista os 37 prêmios', itensLegenda.length === 37, itensLegenda.length);
            const soma = [...itensLegenda].reduce((s, li) => s + parseFloat(li.querySelector('b').textContent), 0);
            conferir('os percentuais da legenda somam ~100%', Math.abs(soma - 100) < 0.6, soma.toFixed(2) + '%');

            // --- compra de giros ---
            const bts = document.querySelectorAll('#roletaCompra .roleta-compra-item');
            conferir('os dois itens de giro aparecem para compra', bts.length === 2, bts.length);

            // --- botão travado sem saldo ---
            const btn = document.getElementById('roletaBtnGirar');
            conferir('o botão GIRAR nasce travado sem giros', btn && btn.disabled);

            // --- INVARIANTE: a agulha para na fatia sorteada ---
            const lista = fatias(window.__roletaBancada.premios);
            let erros = 0, pior = '';
            for (const alvo of [0, 5, 12, 26, 34, 35, 36]) {
                const parou = await window.__roletaAnimarPara(alvo, 60);
                if (parou !== alvo) { erros++; pior = `pediu ${alvo}, parou ${parou}`; }
            }
            conferir('a agulha para na fatia sorteada (7 alvos, incluindo os de 0,3%)', erros === 0, pior);

            /* --- NENHUMA FATIA SOME ---
               A de 0,09% em proporcao pura da 0,32 grau: meio pixel de arco. E
               fatia que some diz a coisa errada — quem olha conclui que o premio
               nao esta na roda, e ele esta. */
            const menor = lista.reduce((a, b) => a.tamanho < b.tamanho ? a : b);
            const piso = minimoDeFatia(lista.length);
            conferir('nenhuma fatia fica abaixo do piso de ' + piso.toFixed(1) + '°',
                menor.tamanho >= piso - 1e-9, 'a menor tem ' + menor.tamanho.toFixed(2) + '°');
            conferir('e a de 0,09% ficou visivel de verdade (>= 6px de arco na roda)',
                (piso / 360) * 2 * Math.PI * (canvas.clientWidth / 2 * 0.9) >= 6,
                ((piso / 360) * 2 * Math.PI * (canvas.clientWidth / 2 * 0.9)).toFixed(1) + 'px');
            conferir('mas quem ja cabia manteve proporcao exata',
                Math.abs(lista.find(x => CHANCES[x.indice] === 5 && !x.inflada).tamanho
                    / lista.find(x => CHANCES[x.indice] === 1 && !x.inflada).tamanho - 5) < 1e-9);

            /* --- A LEGENDA ABRE PELO MAIS RARO ---
               A ordem de cadastro nao diz nada a ninguem. O que a pessoa procura
               e o premio grande, e o premio grande e o improvavel. */
            {
                const pcts = [...document.querySelectorAll('#roletaLegenda li b')]
                    .map(b => parseFloat(b.textContent));
                conferir('a legenda vai do mais raro para o mais comum',
                    pcts.every((v, i) => i === 0 || pcts[i - 1] <= v + 1e-9),
                    pcts.slice(0, 4).join(' , ') + ' ... ' + pcts.slice(-2).join(' , '));
                conferir('e o primeiro da lista e mesmo o de menor chance',
                    Math.abs(pcts[0] - Math.min(...pcts)) < 1e-9);
                /* O quadradinho de cor sai da posicao na RODA, nao na lista: e
                   ele que liga a linha a fatia. Ordenar nao pode reembaralhar. */
                const primeiro = document.querySelector('#roletaLegenda .roleta-legenda-bt');
                const indice = Number(primeiro.dataset.indice);
                const naRoda = lista.findIndex(x => x.indice === indice);
                const esperada = ['--lr-gold', '--lr-blood-2', '--lr-bronze', '--lr-arcane'][naRoda % 4];
                const css = getComputedStyle(document.documentElement).getPropertyValue(esperada).trim();
                // O navegador reescreve o hex do style inline como rgb(), entao
                // passo a cor esperada pela MESMA reescrita antes de comparar.
                const sonda = document.createElement('i');
                sonda.style.background = css;
                conferir('e a cor da linha continua sendo a cor da fatia na roda',
                    primeiro.querySelector('i').style.background === sonda.style.background,
                    primeiro.querySelector('i').style.background + ' contra ' + sonda.style.background);
            }

            // --- responsivo ---
            const largura = document.documentElement.clientWidth;
            const caixa = dialogo?.getBoundingClientRect();

            // --- ONDE A CAIXA NASCE ---
            // `* { margin: 0 }` no menu.css atropelava o `margin: auto` que o
            // navegador da ao <dialog>, e e ele quem centraliza o showModal():
            // sem isso a janela nascia grudada no canto de cima a esquerda.
            if (caixa) {
                const fe = caixa.left, fd = largura - caixa.right;
                const ft = caixa.top, fb = document.documentElement.clientHeight - caixa.bottom;
                conferir('a janela abre centrada na horizontal', Math.abs(fe - fd) <= 2,
                    `${fe.toFixed(0)} a esquerda, ${fd.toFixed(0)} a direita`);
                conferir('a janela abre centrada na vertical', Math.abs(ft - fb) <= 2,
                    `${ft.toFixed(0)} em cima, ${fb.toFixed(0)} embaixo`);
                conferir('nada da janela fica fora da tela',
                    caixa.top >= -1 && caixa.left >= -1
                    && caixa.bottom <= document.documentElement.clientHeight + 1
                    && caixa.right <= largura + 1,
                    `topo ${caixa.top.toFixed(0)}, base ${caixa.bottom.toFixed(0)} de ${document.documentElement.clientHeight}`);
            }

            // --- QUEM ROLA E O CORPO, NAO A JANELA ---
            // Antes eram dois `calc(100vh - ...)` independentes (48 na janela,
            // 130 no corpo) que precisavam somar certo a mao — e nao somavam:
            // numa janela baixa o cartao do premio ficava abaixo da dobra.
            const corpo = document.querySelector('.roleta-corpo');
            const topo = document.querySelector('.roleta-topo');
            conferir('o topo fica fixo e nao encolhe',
                topo && getComputedStyle(topo).flexShrink === '0');
            conferir('a rolagem e do corpo, nunca da janela',
                dialogo && dialogo.scrollHeight <= dialogo.clientHeight + 1,
                dialogo ? `${dialogo.scrollHeight} de ${dialogo.clientHeight}` : '');
            conferir('o corpo termina dentro da janela',
                corpo && caixa && corpo.getBoundingClientRect().bottom <= caixa.bottom + 1);

            // --- O DISCO NAO SE REDESENHA A CADA QUADRO ---
            // Sao ~37 fatias mais os rotulos; repintar tudo por quadro durante
            // quatro segundos de giro e o que engasgava a roda no celular.
            const fonte = await (await fetch('/menu/js/menu-roleta.js?cb=' + Date.now())).text();
            conferir('o disco e pintado uma vez e blitado', /construirDisco/.test(fonte) && /drawImage\(disco/.test(fonte));
            conferir('e o cache cai quando muda tamanho, tema ou premios',
                /chaveDoDisco/.test(fonte) && /documentElement\.className/.test(fonte));

            // --- A CURVA DO GIRO ---
            conferir('a curva vem do modulo testado, nao de um easeOut solto',
                /shared\/roleta-curva\.js/.test(fonte) && !/easeOutQuart/.test(fonte));
            {
                const passo = 1 / 400;
                const vel = (x) => (curvaGiro(x + passo) - curvaGiro(x)) / passo;
                let vMax = 0, tPico = 0;
                for (let i = 0; i < 400; i++) { const v = vel(i / 400); if (v > vMax) { vMax = v; tPico = i / 400; } }
                conferir('a forca chega ao pico cedo e cai dai em diante', tPico <= 0.2,
                    `pico em ${(tPico * 100).toFixed(0)}% do tempo`);
                conferir('e o fim e um sussurro (para suave)', vel(0.98) < vMax * 0.02,
                    `${(vel(0.98) / vMax * 100).toFixed(1)}% do pico`);
            }
            /* --- O GIRO DURA O MESMO PARA TODO MUNDO ---
               Este ramo ja errou duas vezes. Primeiro quem tinha
               `prefers-reduced-motion` — e no Windows basta ter desligado as
               animacoes do sistema — era TELETRANSPORTADO para o angulo final: a
               roleta "girava" mostrando so o resultado. Depois ganhou um giro de
               1,5s, que continuou parecendo um resultado piscando na tela.
               O tempo e a espera, e a espera e a graca: ele nao muda para
               ninguem. O caso calmo perde VOLTAS, nunca segundos. */
            conferir('o giro dura o mesmo para todo mundo',
                fonte.includes('await animarAte(alvo, DURACAO_GIRO)')
                && !fonte.includes('if (menosMovimento()) {')
                && !fonte.includes('calmo ? 1500'));
            conferir('e o caso calmo perde voltas, nao tempo',
                fonte.includes('const voltas = calmo ? 2 :'));
            conferir('a espera e de uns cinco segundos', /DURACAO_GIRO = (5[0-9]{3}|6000);/.test(fonte),
                (fonte.match(/DURACAO_GIRO = d+/) || ['?'])[0]);

            /* --- A FORCA COMANDA A ENCENACAO ---
               Rastro, torcao da agulha e altura do tic penduram todos no mesmo
               numero. Se ele nao zerar no fim, a roda parada fica borrada e com
               a agulha torta. */
            {
                const antes = window.__roletaEstado();
                conferir('parada, a roda nao tem rastro nem agulha torta',
                    antes.forcaAtual === 0 && antes.flickAgulha === 0,
                    `forca=${antes.forcaAtual}, agulha=${antes.flickAgulha}`);

                let picoForca = 0, picoAgulha = 0;
                const espiar = setInterval(() => {
                    const e = window.__roletaEstado();
                    picoForca = Math.max(picoForca, e.forcaAtual);
                    picoAgulha = Math.max(picoAgulha, Math.abs(e.flickAgulha));
                }, 16);
                await window.__roletaAnimarPara(9, 900);
                clearInterval(espiar);

                /* Sem quadro nao ha giro: `animarAte` vai direto ao fim de
                   proposito, para o botao nunca ficar preso em "Girando..."
                   com o premio ja entregue. Medir forca ai e medir o nada. */
                if (!temQuadros) {
                    pular('durante o giro a roda ganha forca de verdade',
                        'este navegador nao entrega quadros de animacao');
                    pular('e a agulha chega a balancar',
                        'este navegador nao entrega quadros de animacao');
                } else {
                    conferir('durante o giro a roda ganha forca de verdade', picoForca > 0.5,
                        `pico ${picoForca.toFixed(2)}`);
                    conferir('e a agulha chega a balancar', picoAgulha > 4,
                        `${picoAgulha.toFixed(1)}deg`);
                }
                // Esta vale sempre: com ou sem quadro, o fim tem de repousar.
                const dep = window.__roletaEstado();
                conferir('no fim ela volta ao repouso', dep.forcaAtual === 0 && dep.flickAgulha === 0,
                    `forca=${dep.forcaAtual}, agulha=${dep.flickAgulha}`);
            }

            conferir('o rastro so e desenhado com a roda em movimento',
                fonte.includes('if (forcaAtual > 0.05)') && fonte.includes('drawImage(disco'));

            // --- A FATIA VENCEDORA ACENDE ---
            {
                window.__roletaAcender(12, false);
                const aceso = window.__roletaEstado().destaque;
                conferir('a fatia sorteada fica acesa na roda',
                    aceso && aceso.indice === 12 && aceso.pulso > 0);
            }

            /* --- A CURVA PARA DE VERDADE, E SO NO FIM ---
               Atrito so viscoso morre por assintota: a roda vai ficando cada vez
               mais lenta e nunca da o ultimo clique. O atrito seco zera em tempo
               finito, e e ele que entrega a parada. E ela tem de continuar
               andando ate tarde: se aos 80% do tempo ja nao sobra percurso, o
               relogio cumpre os cinco segundos mas o olho da a roda por parada. */
            conferir('a roda ainda anda a 97% do tempo', curvaGiro(0.97) < 1);
            conferir('e aos 80% do tempo ainda sobra giro que se veja',
                1 - curvaGiro(0.8) > 0.012, `sobra ${((1 - curvaGiro(0.8)) * 100).toFixed(2)}%`);
            conferir('o comeco e legivel: nao despeja metade do giro em 15% do tempo',
                curvaGiro(0.15) < 0.5, `${(curvaGiro(0.15) * 100).toFixed(0)}% em 15% do tempo`);

            /* --- ESPIAR UMA FATIA ---
               A roda diz a chance em porcentagem miuda girada de lado, a legenda
               diz em texto do outro lado, e ninguem liga uma na outra sem apontar
               o dedo. Tocar a fatia tem de abrir O PREMIO DAQUELA fatia: errar
               aqui e pior que nao mostrar nada, porque a pessoa acredita. */
            {
                const canvas = document.getElementById('roletaCanvas');
                const cartao = document.getElementById('roletaEspiada');
                const listaF = fatias(window.__roletaBancada.premios);
                const nomeDe = i => window.__roletaBancada.premios[i].nome;

                const tocar = (indice) => {
                    const { caixa, centro, raio } = window.__roletaEspiada().medidas;
                    const fa = listaF.find(x => x.indice === indice);
                    const a = (fa.meio + window.__roletaEstado().rotacao) * Math.PI / 180;
                    canvas.dispatchEvent(new MouseEvent('click', {
                        bubbles: true,
                        clientX: caixa.left + centro + Math.cos(a) * raio * 0.62,
                        clientY: caixa.top + centro + Math.sin(a) * raio * 0.62,
                    }));
                };

                conferir('o cartao de espiada nasce escondido', cartao && cartao.hidden);

                let errou = '';
                for (const alvo of [0, 7, 20, 36]) {
                    window.roletaFecharEspiada();
                    tocar(alvo);
                    const lido = cartao.querySelector('.roleta-espiada-nome')?.textContent;
                    if (cartao.hidden || lido !== nomeDe(alvo)) {
                        errou = `toquei na fatia ${alvo} (${nomeDe(alvo)}) e li "${lido}"`;
                        break;
                    }
                }
                conferir('tocar a fatia abre o premio DAQUELA fatia (4 alvos, incluindo o de 0,3%)',
                    !errou, errou);

                // o cartao tem de ficar SOBRE a roda, nao fora dela
                {
                    const c = cartao.getBoundingClientRect();
                    const { caixa } = window.__roletaEspiada().medidas;
                    conferir('e o cartao abre por cima da roda',
                        c.left >= caixa.left - 1 && c.right <= caixa.right + 1
                        && c.top >= caixa.top - 1 && c.bottom <= caixa.bottom + 1);
                }

                // a chance mostrada e a mesma da legenda, ou o cartao mente
                {
                    window.roletaFecharEspiada();
                    tocar(7);
                    const noCartao = cartao.querySelector('.roleta-espiada-chance b').textContent;
                    const naLegenda = [...document.querySelectorAll('#roletaLegenda li')]
                        .find(li => li.querySelector('span').textContent === nomeDe(7))
                        ?.querySelector('b').textContent;
                    conferir('a chance do cartao bate com a da legenda',
                        noCartao.replace(',', '.') === naLegenda, `${noCartao} contra ${naLegenda}`);
                    conferir('e a descricao do item aparece',
                        /pista forte/.test(cartao.querySelector('.roleta-espiada-desc')?.textContent || ''));
                }

                // a fatia espiada fica acesa: e como se sabe QUAL foi tocada
                conferir('a fatia espiada acende na roda',
                    window.__roletaEstado().destaque?.indice === 7);

                // tocar de novo na mesma fatia fecha
                tocar(7);
                conferir('tocar de novo na mesma fatia fecha', cartao.hidden);

                // o eixo nao e fatia de ninguem
                {
                    tocar(7);
                    const { caixa, centro } = window.__roletaEspiada().medidas;
                    canvas.dispatchEvent(new MouseEvent('click', {
                        bubbles: true, clientX: caixa.left + centro, clientY: caixa.top + centro,
                    }));
                    conferir('tocar o eixo fecha, nao abre fatia nenhuma', cartao.hidden);
                }

                // e a legenda faz o mesmo, que e o caminho de quem usa teclado
                {
                    const bt = document.querySelector('#roletaLegenda .roleta-legenda-bt');
                    conferir('cada linha da legenda e um botao de verdade',
                        bt && bt.tagName === 'BUTTON');
                    bt?.click();
                    conferir('e clicar nela abre a mesma espiada', !cartao.hidden);
                    window.roletaFecharEspiada();
                    conferir('fechada, a espiada apaga o holofote junto',
                        cartao.hidden && !window.__roletaEstado().destaque);
                }
            }

            conferir('a janela cabe na largura da tela', caixa && caixa.width <= largura, `${caixa?.width?.toFixed(0)} de ${largura}`);
            conferir('a página não ganhou rolagem horizontal',
                document.documentElement.scrollWidth <= largura);

            /* --- O SOM ---
               Ele so toca num giro de verdade, entao sem esta fresta ninguem
               nunca o executa fora de producao. E ele mexe com BufferSource,
               BiquadFilter e rampa exponencial, onde um zero no lugar errado
               vira excecao no meio do giro. */
            conferir('o botao de som existe', !!document.getElementById('roletaSom'));
            {
                const btSom = document.getElementById('roletaSom');
                const estavaMudo = btSom.textContent.trim() === '🔇';
                if (estavaMudo) window.roletaAlternarSom();

                const ctx = window.__roletaSoar.garantirAudio();
                conferir('o contexto de audio nasce', !!ctx);

                let estourou = '';
                try {
                    // as duas pontas da forca, e o meio
                    [1, 0.5, 0, undefined].forEach(f => window.__roletaSoar.tic(f));
                    window.__roletaSoar.fanfarra();
                } catch (e) { estourou = e.message; }
                conferir('estalo e badalada tocam sem estourar', !estourou, estourou);

                if (estavaMudo) window.roletaAlternarSom();
            }
            conferir('o estalo e ruido filtrado, nao onda quadrada',
                fonte.includes("banda.type = 'bandpass'") && !fonte.includes("osc.type = 'square'"));
            conferir('e o ruido e gerado uma vez so, nao a cada cravo',
                fonte.includes('if (ruidoBuf) return ruidoBuf;'));

            // --- FECHADA, A JANELA TEM DE SUMIR ---
            // O navegador esconde <dialog> fechado com
            // `dialog:not([open]) { display: none }`. Um `display: flex` de
            // autor no seletor solto VENCE essa regra, e a roda fica pintada
            // no meio do Portal depois de fechar. Foi o que aconteceu quando a
            // janela virou coluna flex.
            dialogo.close();
            await new Promise(r => setTimeout(r, 30));
            conferir('fechada, a janela some de vez',
                getComputedStyle(dialogo).display === 'none',
                `display=${getComputedStyle(dialogo).display}`);
            conferir('e nao deixa nada ocupando espaco na pagina',
                dialogo.getBoundingClientRect().height === 0);
            await window.abrirRoleta();
            conferir('e volta a aparecer ao reabrir',
                getComputedStyle(dialogo).display !== 'none');

            // --- O CARTAO DO PREMIO E TRAZIDO PARA A VISTA ---
            // A roda ocupa quase toda a coluna, entao o cartao nasce abaixo da
            // dobra. Nao adianta so caber: tem de aparecer sozinho.
            const fonteR = semComentarios(await (await fetch('/menu/js/menu-roleta.js?cb=' + Date.now())).text());
            conferir('o cartao do premio rola sozinho para a vista',
                /scrollIntoView/.test(fonteR));

            // --- AS IMAGENS DO HERO ---
            // O Storage do Firebase nao manda Access-Control-Allow-Origin, e
            // `crossOrigin = 'anonymous'` fazia TODA imagem falhar — em
            // silencio, porque o allSettled filtrava as rejeitadas e o hero
            // voltava para o selo desenhado. O canvas so faz drawImage e nunca
            // le pixel de volta, entao pedir CORS nao comprava nada.
            const fonteHBruta = await (await fetch('/menu/js/menu-hero.js?cb=' + Date.now())).text();
            const fonteH = semComentarios(fonteHBruta);
            conferir('o hero nao pede CORS para imagem que ele so desenha',
                !/crossOrigin/.test(fonteH));
            conferir('e o canvas do hero realmente nunca le pixel de volta',
                !/getImageData|toDataURL|toBlob/.test(fonteH));
            conferir('imagem que nao carrega deixa aviso, nao silencio',
                /console\.warn\('Hero: '/.test(fonteH));
            // e o proprio ajudante tem de funcionar, senao os tres acima sao decorativos
            conferir('a varredura ignora comentario de verdade',
                semComentarios('/* crossOrigin */ var a = 1;').indexOf('crossOrigin') === -1
                && semComentarios('var crossOrigin = 1;').indexOf('crossOrigin') >= 0);

            /* Pulado NAO entra em "passaram": um placar que soma o que nem
               chegou a rodar mente com numero redondo, que e a pior forma. */
            saida.innerHTML = linhas.join('\n') +
                `\n\n<b>${ok} passaram, ${falhou} falharam</b>` +
                (falhou === 0 ? ' <span class="ok">— tudo certo</span>' : '') +
                (pulados ? `\n<span class="pulado">${pulados} pulado(s) — este navegador nao entrega `
                    + `${!temQuadros && !temLayout ? 'quadro nem layout' : (!temQuadros ? 'quadros de animacao' : 'layout vivo')}</span>` : '');
        };
    </script>
    <script type="module" src="/menu/js/menu-roleta.js?v=12"></script>
</body>
