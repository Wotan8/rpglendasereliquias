<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found</title>

    <style media="screen">
      body { background: var(--lr-bg-0); color: var(--lr-text-1); font-family: var(--lr-font-body); margin: 0; padding: 0; }
      #message { background: var(--lr-surface); border: 1px solid var(--lr-border); border-top: 2px solid var(--lr-gold); max-width: 360px; margin: 100px auto 16px; padding: 32px 24px 16px; border-radius: var(--lr-radius-lg); box-shadow: var(--lr-shadow-3); }
      #message h3 { color: var(--lr-text-2); font-weight: normal; font-size: 16px; margin: 16px 0 12px; }
      #message h2 { color: var(--lr-gold); font-family: var(--lr-font-title); font-size: 16px; margin: 0 0 8px; }
      #message h1 { font-size: 22px; font-family: var(--lr-font-title); color: var(--lr-divine); margin: 0 0 16px;}
      #message p { line-height: 140%; margin: 16px 0 24px; font-size: 14px; color: var(--lr-text-2); }
      #message a { display: block; text-align: center; background: var(--lr-gold); text-transform: uppercase; text-decoration: none; color: #1a1408; font-weight: 700; padding: 16px; border-radius: var(--lr-radius); }
      #load { color: var(--lr-text-2); text-align: center; font-size: 13px; }
      @media (max-width: 600px) {
        body, #message { margin-top: 0; box-shadow: none; }
        body { border-top: 3px solid var(--lr-gold); }
      }
    </style>
  <script type="module" src="/js/global-favicon.js"></script>
    <!-- Design System — Lendas & Relíquias (ver DESIGN-SYSTEM.md) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="shared/tokens.css?v=11">
    <link rel="stylesheet" href="shared/lendas-reliquias.css?v=2">
</head>
  <body>
    <div id="message">
      <h2>404</h2>
      <h1>Page Not Found</h1>
      <p>The specified file was not found on this website. Please check the URL for mistakes and try again.</p>
      <h3>Why am I seeing this?</h3>
      <p>This page was generated by the Firebase Command-Line Interface. To modify it, edit the <code>404.html</code> file in your project's configured <code>public</code> directory.</p>
    </div>
  </body>
</html>
