<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>__check — Rota do token e giro da visão</title>
<link rel="stylesheet" href="../shared/sanfona.css">
<link rel="stylesheet" href="../shared/dialogo.css?v=2">
<script type="module">import '../shared/dialogo.js?v=2';</script>
<!-- ⚠️ ORDEM: tabuleiro.css vem ANTES de tokens.css, como na página real.
     Não é detalhe — é do que depende a paleta escura presa em `html, body`
     (o cabeçalho do tabuleiro.css explica) e é o que decide quem vence entre
     dois seletores de mesma especificidade. Com a ordem trocada a bancada
     mede uma cascata que não existe. -->
<link rel="stylesheet" href="css/tabuleiro.css">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  html,body{margin:0;height:100%;background:#0b0e14;color:#e6e8ef;font:14px/1.6 Inter,system-ui,sans-serif}
  #tbCanvas{position:fixed;inset:0;width:100vw;height:100vh}
  #saida{position:fixed;inset:12px auto 12px 12px;width:560px;z-index:10;background:#12161f;
         border:1px solid #2a3040;border-radius:12px;padding:14px;overflow:auto;max-height:calc(100vh - 24px)}
  h1{font-size:1rem;margin:0 0 4px} p{margin:0 0 12px;color:#8b93a7;font-size:.8rem}
  .ok{color:#34d399} .fail{color:#f87171;font-weight:700} .res{font-family:ui-monospace,monospace;font-size:.78rem}
  #placar{font-weight:800;margin-top:10px;padding-top:10px;border-top:1px solid #2a3040}
</style></head>
<body>
<canvas id="tbCanvas"></canvas>
<!-- o boot do tab-main escreve aqui quando não acha `?mesa=`; sem o nó,
     o harness morria num erro que não é do que está sendo testado -->
<div id="tbLoading" hidden></div>
<div id="tbCoords"></div>
<div class="tb-ctx" id="tbCtxMenu"></div><div id="tbPinPopup"></div>
<div class="tb-side-panel" id="tbPropsPanel"><div class="tb-side-body" id="tbPropsBody"></div></div>
<button id="tbLockBtn"></button>
<div class="tb-modal" id="tbModal"><div class="tb-modal-content"><span class="tb-modal-title"></span><div class="tb-modal-body"></div></div></div>

<div id="saida">
  <h1>🧭 Rota do token (botão direito) e giro da visão</h1>
  <p>Dispara PointerEvents reais contra <code>tab-tools.js</code>, no mesmo espírito do
     <code>__check-regua.html</code>. Cobre o vértice de rota com o mouse e o giro do
     token pelo jogador (visão em cone precisa mirar).</p>
  <div id="res" class="res"></div>
  <div id="placar"></div>
</div>

<script type="module">
import { T, CAMADAS_PADRAO } from './js/tab-state.js';
import { initTools, setTool } from './js/tab-tools.js';
import { startRenderLoop, desenharUmFrame } from './js/tab-render.js';
import { initGirar } from './js/tab-girar.js';

T.mesaId = 'check'; T.mode = 'secret'; T.isMaster = true; T.user = { uid: 'u' };
T.canvas = { grid: { size: 70, show: true, snap: false, tipo: 'quad' },
             escala: { valorPorCelula: 1.5, unidade: 'm' }, camadas: CAMADAS_PADRAO, permissoes: {},
             bloquearMovimento: false };
T.measureCfg.mostrarOutros = false;
T.measureCfg.medirToken = true;
HTMLElement.prototype.setPointerCapture = function () {};
T.canvasId = 'check';   // sem isto todo updObj vira ruído de Firestore no console
startRenderLoop(); initTools(); initGirar();

const cv = document.getElementById('tbCanvas');
const ev = (t, x, y, botao, botoes, pid = 1, ptype = 'mouse') => cv.dispatchEvent(
    new PointerEvent(t, { bubbles: true, cancelable: true, clientX: x, clientY: y,
        button: botao, buttons: botoes, pointerId: pid, pointerType: ptype, isPrimary: pid === 1 }));
const up = (x, y, botao, botoes, pid = 1, ptype = 'mouse') => window.dispatchEvent(
    new PointerEvent('pointerup', { bubbles: true, cancelable: true, clientX: x, clientY: y,
        button: botao, buttons: botoes, pointerId: pid, pointerType: ptype, isPrimary: pid === 1 }));

// Teclado: é assim que o jogador gira de verdade. Dispara no BODY (e sobe
// até o window): num teclado real o alvo é sempre um elemento, e handlers
// que leem e.target.matches quebrariam se o alvo fosse o window.
const tecla = (k, shift) => document.body.dispatchEvent(
    new KeyboardEvent('keydown', { key: k, shiftKey: !!shift, bubbles: true, cancelable: true }));

let ok = 0, falhou = 0;
const linhas = [];
const eq = (nome, obtido, esperado) => {
    const passou = JSON.stringify(obtido) === JSON.stringify(esperado);
    passou ? ok++ : falhou++;
    linhas.push(`<div class="${passou ? 'ok' : 'fail'}">${passou ? '✅' : '❌'} ${nome}` +
        (passou ? '' : ` — esperado ${JSON.stringify(esperado)}, veio ${JSON.stringify(obtido)}`) + '</div>');
};
/** Sempre pinta o parcial: harness que morre calado não diz onde morreu. */
function mostrar(erro) {
    document.getElementById('res').innerHTML = linhas.join('') +
        (erro ? `<div class="fail">💥 parou aqui: ${erro}</div>` : '');
    document.getElementById('placar').innerHTML = (falhou || erro)
        ? `<span class="fail">${falhou} FALHA(S)${erro ? ' + erro' : ''}</span> · ${ok} ok`
        : `<span class="ok">TODOS OS ${ok} CASOS PASSARAM</span>`;
}
window.addEventListener('error', (e) => mostrar(`${e.message}\n${(e.error?.stack || '').split('\n').slice(0, 4).join('\n')}`));

/**
 * Mundo sob um ponto de TELA, do jeito que os handlers enxergam.
 * screenToWorld() não serve aqui: ela parte do canvas já em px de device,
 * e com dpr ≠ 1 o resultado difere do que evWorld() calcula a partir do
 * clientX do evento — o token ficava fora do cursor e o arrasto não pegava.
 */
function mundoEm(xTela, yTela) {
    ev('pointermove', xTela, yTela, -1, 0);
    const [mx, my] = document.getElementById('tbCoords').textContent
        .split('·')[0].split(',').map(s => parseFloat(s));
    return { x: mx, y: my };
}

/** Cria um token de personagem sob o ponto de tela dado. */
function novoToken(xTela, yTela) {
    T.objects.clear();
    const w = mundoEm(xTela, yTela);
    const o = {
        id: 'tk1', tipo: 'token', layerId: 'tokens', x: w.x, y: w.y,
        nome: 'Naruto', tamanhoCelulas: 1, rot: 0, visivelPublico: true,
        vinculo: { tipo: 'char', id: 'c1' },
        visao: { ativa: true, alcance: 9, angulo: 220, tipo: 'padrao' },
        luz: { ativa: false, alcance: 3 },
    };
    T.objects.set(o.id, o);
    T.chars = [{ id: 'c1', nome: 'Naruto', ownerUid: 'u' }];
    T.selection = null;
    setTool('select');
    return o;
}

// A rota é observável por fora: o trail alimenta a régua em T.temp.pontos,
// que sempre é [ ...vértices fixados, posição atual ].
const vertices = () => T.temp?.tipo === 'medida' ? T.temp.pontos.length : null;

// ===== A) ROTA: botão direito durante o arrasto cria vértice =====
novoToken(400, 400);
ev('pointerdown', 400, 400, 0, 1);                    // pega o token
ev('pointermove', 500, 400, -1, 1);                   // arrasta 100px
eq('A1 arrastar já mostra a régua do movimento', vertices(), 2);

ev('pointerdown', 500, 400, 2, 3);                    // direito COM o esquerdo preso
ev('pointermove', 500, 520, -1, 1);                   // segue arrastando
eq('A2 botão direito fixa vértice (a rota dobra)', vertices(), 3);

ev('pointerdown', 500, 520, 2, 3);                    // segundo vértice
ev('pointermove', 620, 520, -1, 1);
eq('A3 segundo vértice também entra', vertices(), 4);

up(620, 520, 2, 1);                                   // soltar o direito NÃO encerra
ev('pointermove', 660, 520, -1, 1);
eq('A4 soltar o botão direito mantém o arrasto vivo', vertices(), 4);

up(660, 520, 0, 0);                                   // solta o esquerdo: fim
eq('A5 soltar o esquerdo encerra e limpa a régua', T.temp, null);

// ===== A') OUTROS CAMINHOS PARA O VÉRTICE (o botão direito falha no PC real) =====
novoToken(400, 400);
ev('pointerdown', 400, 400, 0, 1);
ev('pointermove', 500, 400, -1, 1);
eq("A7 régua viva antes do vértice", vertices(), 2);
// ESPAÇO durante o arrasto
tecla(' ');
ev('pointermove', 500, 500, -1, 1);
eq('A8 Espaço fixa vértice durante o arrasto', vertices(), 3);
// botão direito detectado pelo bitmask de `buttons`, sem pointerdown
ev('pointermove', 600, 500, -1, 3);
ev('pointermove', 620, 500, -1, 3);
eq('A9 botão direito pelo bitmask fixa vértice', vertices(), 4);
ev('pointermove', 640, 500, -1, 1);   // soltou o direito
ev('pointermove', 660, 500, -1, 3);   // apertou de novo
eq('A10 segurar o direito não repete vértice a cada pixel', vertices(), 5);
up(660, 500, 0, 0);

// ===== B) GIRO: o jogador precisa mirar o cone de visão =====
const tk2 = novoToken(400, 400);
T.selection = tk2.id;
eq('B1 token nasce olhando para 0°', tk2.rot, 0);
eq('B2 existe um jeito de girar o token', typeof window.tbGirarToken === 'function', true);
window.tbGirarToken('tk1', 90);
eq('B3 girar 90° vira o cone', T.objects.get('tk1').rot, 90);
window.tbGirarToken('tk1', -180);
eq('B4 ângulo negativo normaliza para 0–359', T.objects.get('tk1').rot, 270);
window.tbGirarToken('tk1', 450);
eq('B5 acima de 360 dá a volta', T.objects.get('tk1').rot, 0);

tecla('e');
eq('B6 tecla E gira 15° no sentido horário', T.objects.get('tk1').rot, 15);
tecla('q');
eq('B7 tecla Q volta 15°', T.objects.get('tk1').rot, 0);
tecla('e', true);
eq('B8 Shift+E gira 45°', T.objects.get('tk1').rot, 45);
tecla('Q', true);
eq('B9 maiúscula também vale (Shift muda a caixa)', T.objects.get('tk1').rot, 0);

// Sem seleção não gira nada
T.selection = null;
tecla('e');
eq('B10 sem token selecionado a tecla não faz nada', T.objects.get('tk1').rot, 0);

// ===== B') GIRO AUTOMÁTICO: o token olha para onde anda =====
const tk3 = novoToken(400, 400);
tk3.rot = 0;
ev('pointerdown', 400, 400, 0, 1);
ev('pointermove', 560, 400, -1, 1);          // arrasta para a DIREITA
eq('B11 andar para a direita vira o token para 90°', T.objects.get('tk1').rot, 90);
ev('pointermove', 560, 560, -1, 1);          // agora para BAIXO
eq('B12 andar para baixo vira para 180°', T.objects.get('tk1').rot, 180);
ev('pointermove', 400, 560, -1, 1);          // para a ESQUERDA
eq('B13 andar para a esquerda vira para 270°', T.objects.get('tk1').rot, 270);
ev('pointermove', 400, 400, -1, 1);          // para CIMA
eq('B14 andar para cima vira para 0°', T.objects.get('tk1').rot, 0);
up(400, 400, 0, 0);

// Token de visão 360° não precisa mirar: não deve girar sozinho
const tk4 = novoToken(400, 400);
tk4.visao = { ativa: true, alcance: 9, angulo: 360, tipo: 'padrao' };
tk4.rot = 33;
ev('pointerdown', 400, 400, 0, 1);
ev('pointermove', 560, 400, -1, 1);
eq('B15 visão de 360° não gira sozinha', T.objects.get('tk1').rot, 33);
up(560, 400, 0, 0);

// ===== C) TOQUE: no celular não há Q/E — os botões são o único caminho =====
novoToken(400, 400);          // o teste anterior deixou o token com visão 360°
T.selection = 'tk1';
desenharUmFrame();   // aba oculta = sem rAF; o frame é pedido na mão
const bar = document.getElementById('tbGirarBar');
eq('C1 barra de girar existe', !!bar, true);
eq('C2 barra aparece com token de cone selecionado', bar && !bar.hidden, true);
eq('C2b e aparece de verdade (display não é none)', getComputedStyle(bar).display !== 'none', true);
eq('C2c botões cabem na tela, não esticam', bar.getBoundingClientRect().width < 140, true);
eq('C3 tem os dois sentidos', bar ? bar.querySelectorAll('[data-gira]').length : 0, 2);

/** Toque de verdade: pointerdown com pointerType touch. */
const toque = (el, shift) => el.dispatchEvent(new PointerEvent('pointerdown',
    { bubbles: true, cancelable: true, pointerType: 'touch', isPrimary: true, pointerId: 7, shiftKey: !!shift }));

const antesTap = T.objects.get('tk1').rot;
toque(bar.querySelector('[data-gira="1"]'));
eq('C4 toque no ↻ gira 15°', T.objects.get('tk1').rot, (antesTap + 15) % 360);
toque(bar.querySelector('[data-gira="-1"]'));
eq('C5 toque no ↺ volta 15°', T.objects.get('tk1').rot, antesTap);
toque(bar.querySelector('[data-gira="1"]'), true);
eq('C6 toque com Shift gira 45°', T.objects.get('tk1').rot, (antesTap + 45) % 360);

// Token SEM cone não mostra a barra (360° não precisa mirar)
T.objects.get('tk1').visao = { ativa: true, alcance: 9, angulo: 360, tipo: 'padrao' };
desenharUmFrame();
eq('C7 visão de 360° não mostra os botões', getComputedStyle(bar).display, 'none');

// Voltando ao cone, a barra reaparece
T.objects.get('tk1').visao = { ativa: true, alcance: 9, angulo: 220, tipo: 'padrao' };
desenharUmFrame();
eq('C8 com cone de novo, a barra volta', bar.hidden, false);

// Deselecionar esconde
T.selection = null;
desenharUmFrame();
eq('C9 sem seleção a barra some', getComputedStyle(bar).display, 'none');

mostrar();
</script>
</body></html>
