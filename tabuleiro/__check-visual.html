<!DOCTYPE html>
<html lang="pt-BR" class="app-canvas"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__check — Tabuleiro, a moldura sobre o mapa</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/lendas-reliquias.css">
<link rel="stylesheet" href="../shared/sanfona.css">
<link rel="stylesheet" href="css/tabuleiro.css">
<script>for (const l of document.querySelectorAll('link[href*="tabuleiro.css"]')) l.href += '?cb=' + Date.now();</script>
<style>
  /* Um "mapa" de mentira: xadrez escuro, sem rede, só para a moldura ter
     sobre o que flutuar — é assim que se vê se um painel some no fundo. */
  body.app-canvas { margin:0; overflow:hidden;
      background:
        repeating-conic-gradient(#161b22 0 25%, #10141a 0 50%) 0 0 / 96px 96px,
        radial-gradient(120% 90% at 30% 20%, #24303f, #0a0d12 70%); }
  #saida { position:fixed; inset:auto 0 0 0; max-height:44vh; overflow:auto; z-index:9000;
      background:var(--lr-bg-0); border-top:2px solid var(--lr-gold);
      font:11px ui-monospace,monospace; padding:8px 12px; color:var(--lr-text-1); }
  #saida table { border-collapse:collapse; width:100%; }
  #saida td { border:1px solid var(--lr-border); padding:1px 6px; }
  .ok { color:var(--lr-nature); } .fail { color:var(--lr-blood-2); font-weight:700; }
  #placar { font-weight:800; margin-top:6px; }
  #ctrl { position:fixed; right:8px; bottom:46vh; z-index:9001; display:flex; gap:6px; }
  #ctrl button { font:11px system-ui; padding:4px 8px; }
  body.limpo #saida, body.limpo #ctrl { display:none; }
</style></head>
<body class="app-canvas">
<div id="ctrl">
  <button onclick="document.body.classList.toggle('limpo')">🖼️ Só a arte</button>
  <button onclick="abrirTudo()">📂 Abrir painéis</button>
  <span style="font:11px system-ui;color:var(--lr-text-2);align-self:center">
    ↕️ a coluna da esquerda muda com a ALTURA — reteste em ~700, ~620 e ~500px</span>
</div>
<table id="saida"></table>
<div id="placar"></div>
<script src="../shared/lr-icones.js"></script>
<script type="module">
/* A moldura vem do HTML REAL: duplicar a marcação aqui garantiria só que a
   cópia continua bonita enquanto a página de verdade muda sozinha. */
const doc = new DOMParser().parseFromString(
    await (await fetch('tabuleiro.html?cb=' + Date.now())).text(), 'text/html');
const CHROME = ['.tb-topbar', '.tb-toolbar', '#tbDrawBar', '#tbCamadasPanel', '#tbPropsPanel', '.tb-zoombar'];
for (const sel of CHROME) document.body.appendChild(doc.querySelector(sel));

window.abrirTudo = () => {
    document.querySelector('#tbDrawBar').classList.add('open');
    for (const p of document.querySelectorAll('.tb-side-panel')) p.classList.add('open');
};
document.getElementById('tbModeBadge').className = 'tb-mode-badge secret';
document.getElementById('tbModeBadge').textContent = 'Secreto';
document.getElementById('tbMesaNome').textContent = 'A Queda de Reliera';
document.getElementById('tbCanvasNome').textContent = 'Cripta de Vaelthorn';
document.querySelector('#toolMove').classList.add('active');
document.querySelector('#tbCamadasBody').innerHTML = `
  <div class="tb-layer-row active"><span class="tb-layer-name">Mapa</span></div>
  <div class="tb-layer-row"><span class="tb-layer-name">Tokens</span></div>
  <div class="tb-layer-row"><span class="tb-layer-name">Iluminação</span></div>`;
document.querySelector('#tbPropsBody').innerHTML = `
  <div class="tb-props-title">Guarda da Cripta</div>
  <div class="tb-form-grid tb-form-grid-1">
    <label>Nome<input class="tb-input" value="Guarda da Cripta"></label>
    <label>Escala<input class="tb-input" type="number" value="1.5"></label>
  </div>`;
abrirTudo();
await new Promise(r => setTimeout(r, 60));

const linhas = [];
const t = (n, c) => linhas.push(`<tr><td>${n}</td><td class="${c?'ok':'fail'}">${c?'OK':'FALHOU'}</td></tr>`);
const cx = (s) => document.querySelector(s).getBoundingClientRect();

t('T01 · a moldura real carregou', document.querySelectorAll('.tb-tool').length > 10);
t('T02 · a barra não cobre a de ferramentas', cx('.tb-toolbar').top >= cx('.tb-topbar').bottom);
t('T03 · a sub-barra não cobre a de ferramentas', cx('#tbDrawBar').left >= cx('.tb-toolbar').right);
/* Vários testes fazem a MESMA pergunta — os retângulos se tocam? — e a
   resposta não depende de qual arranjo está valendo (no PC o painel fica à
   direita da sub-barra; no celular desce e vira gaveta). */
const sobrepoe = (a, b) => !(a.right <= b.left || b.right <= a.left
                          || a.bottom <= b.top || b.bottom <= a.top);
t(`T04 · painel e sub-barra não se cobrem (${innerWidth}px de janela)`,
    !sobrepoe(cx('#tbCamadasPanel'), cx('#tbDrawBar')));
t('T05 · nada estoura a janela pela direita',
    document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1);
t('T06 · a toolbar cabe na altura sem rolar', cx('.tb-toolbar').bottom <= innerHeight);


/* ===== a coluna da esquerda: barra, player e zoom no mesmo canto =====
   O player é injetado por tab-musica.js, que precisa de Firestore. Aqui entra
   só a casca com a MESMA classe: o que se mede é a posição, e a posição é do
   CSS. */
{
    const player = document.createElement('div');
    player.className = 'tb-musica recolhida';
    player.innerHTML = `<button class="tb-mus-pill"><svg class="tb-ico"><use href="#i-musica"/></svg></button>`;
    document.body.appendChild(player);
    await new Promise(r => setTimeout(r, 40));

    t('T07 · o ícone de playlist é o traço do sprite, não emoji',
        !!document.querySelector('#i-musica') && !!player.querySelector('use[href="#i-musica"]'));
    /* Numa janela baixa a barra de ferramentas quebra em duas colunas e toma o
       canto esquerdo inteiro — aí o botão troca de lado, de propósito. O que
       vale nos dois arranjos é: colado num canto de baixo, e longe da barra. */
    const canto = cx('.tb-musica').left < innerWidth / 2 ? 'esquerdo' : 'direito';
    t(`T08 · o botão de playlist fica colado no canto de baixo ${canto}`,
        cx('.tb-musica').bottom > innerHeight - 120);
    t(`T09 · e não monta na barra de ferramentas (janela de ${innerHeight}px)`,
        !sobrepoe(cx('.tb-musica'), cx('.tb-toolbar')));
    t('T10 · a coluna inteira cabe na tela', cx('.tb-toolbar').bottom <= innerHeight);

    /* Aberto, o player é grande demais para a coluna: sai de lado, senão volta
       a cobrir os últimos ícones — que foi o defeito que trouxe ele para cá. */
    player.className = 'tb-musica';
    player.style.height = '260px';
    await new Promise(r => setTimeout(r, 40));
    t('T11 · aberto, o player não cobre a barra de ferramentas',
        !sobrepoe(cx('.tb-musica'), cx('.tb-toolbar')));
    player.className = 'tb-musica recolhida';
    player.style.height = '';
}

/* ===== o zoom no canto oposto ===== */
{
    await new Promise(r => setTimeout(r, 40));
    const zb = cx('.tb-zoombar');
    t('T12 · o zoom mudou para o canto de baixo à direita',
        zb.left > innerWidth / 2 && zb.bottom > innerHeight - 60);
    t('T13 · o zoom não divide mais canto com o player',
        !sobrepoe(zb, cx('.tb-musica')));
    /* As coordenadas passaram para DENTRO da fileira do zoom: soltas, eram um
       terceiro elemento fixo disputando o canto com a faixa do Painel do Turno,
       e no celular as três se cobriam. */
    t('T14 · as coordenadas viajam na mesma fileira do zoom',
        document.querySelector('#tbCoords').parentElement === document.querySelector('.tb-zoombar'));
    const barra = document.getElementById('tbZoomBarra');
    const larga = innerWidth >= 1024;
    t(`T15 · o curso do zoom ${larga ? 'aparece' : 'some'} em ${innerWidth}px`,
        (getComputedStyle(barra).display !== 'none') === larga);
    if (larga) t('T16 · e fica ENTRE o − e o +', (() => {
        const b = barra.getBoundingClientRect(), bs = [...document.querySelectorAll('.tb-zoombar button')];
        return bs.length === 2 && bs[0].getBoundingClientRect().right <= b.left
            && bs[1].getBoundingClientRect().left >= b.right;
    })());
    /* O curso é logarítmico: o meio da barra tem de cair perto de 50%, não em
       (4%+600%)/2. Com passo linear, 100% ficava a 16% do curso. */
    /* tab-tools.js não roda aqui (precisa de Firestore), então o que dá para
       trancar é o fio: o nome no `oninput` tem de existir do outro lado. Um
       rename de um lado só some com o zoom em silêncio. */
    const fonte = await (await fetch('js/tab-tools.js?cb=' + Date.now())).text();
    const chamada = (barra.getAttribute('oninput') || '').match(/(\w+)\s*\(/);
    t(`T17 · o curso está ligado no motor (${chamada?.[1]})`,
        !!chamada && new RegExp(String.raw`window\.${chamada[1]}\s*=`).test(fonte));
    /* A curva em si tem teste próprio, em tab-zoom-curso.test.mjs. */
    t('T18 · e a curva vem do módulo testado, não de conta solta aqui',
        /from '\.\/tab-zoom-curso\.js'/.test(fonte));

    /* `getComputedStyle(barra, '::-webkit-slider-runnable-track')` NÃO serve:
       o Chrome devolve o estilo do próprio input, então a medição dava
       "transparente" com a regra funcionando e "transparente" com ela quebrada.
       O que ele responde de verdade é o CSSOM — e é a resposta certa, porque
       seletor inválido é DESCARTADO na análise: a regra some da folha. */
    const folha = [...document.styleSheets].find(f => /tabuleiro\.css/.test(f.href || ''));
    const regras = [...folha.cssRules].flatMap(r => r.media ? [...r.cssRules] : [r]);
    const trilho = regras.find(r => /::-webkit-slider-runnable-track/.test(r.selectorText || ''));
    /* `style.backgroundColor` não serve: o valor é `var(--lr-surface-2)`, e
       enquanto a variável não é resolvida a longa fica vazia. O que se pergunta
       é se a DECLARAÇÃO está lá. */
    t('T19 · a regra do trilho sobreviveu à análise e pinta fundo',
        !!trilho && /background\s*:/.test(trilho.style.cssText));

    /* E o motivo de ele ter sumido: juntar ::-webkit-… com ::-moz-… no MESMO
       seletor invalida a lista inteira nos dois navegadores. O Firefox não
       roda aqui, então quem guarda a regra dele é esta varredura. */
    const css = await (await fetch('css/tabuleiro.css?cb=' + Date.now())).text();
    const misturados = [...css.matchAll(/([^{}]+)\{/g)]
        .map(m => m[1]).filter(sel => /::-webkit-/.test(sel) && /::-moz-/.test(sel));
    t(`T20 · nenhum seletor mistura ::-webkit- com ::-moz- (${misturados.length})`,
        misturados.length === 0);
    /* O trilho do Firefox não existe neste navegador, então quem o guarda é a
       fonte: precisa ter regra PRÓPRIA, e ela precisa pintar fundo. */
    const moz = css.match(/#tbZoomBarra::-moz-range-track\s*\{([^}]*)\}/);
    t('T21 · o Firefox tem trilho próprio, com fundo',
        !!moz && /background\s*:/.test(moz[1]));
}

/* ===== os grupos da barra do topo ===== */
{
    const fio = (id) => {
        const b = document.getElementById(id);
        return getComputedStyle(b, '::before').width;
    };
    t('T22 · a barra do topo vem repartida em grupos',
        ['btnRelogio', 'btnCombate', 'btnCanvases'].every(id => fio(id) === '1px'));
    /* O jogador não vê preparo do mestre nem gerência de canvas. O fio some
       COM o botão — senão sobra um risco no meio da barra, apontando nada. */
    for (const id of ['btnRelogio', 'btnTeleprompter', 'btnSessao', 'btnCanvases'])
        document.getElementById(id).style.display = 'none';
    const risco = [...document.querySelectorAll('.tb-topbar .tb-grupo')]
        .filter(b => getComputedStyle(b).display !== 'none');
    t('T23 · na visão do jogador nenhum fio fica pendurado',
        risco.length === 1 && risco[0].id === 'btnCombate');
    for (const id of ['btnRelogio', 'btnTeleprompter', 'btnSessao', 'btnCanvases'])
        document.getElementById(id).style.display = '';
}

/* ===== a ação primária não é quem sai da tela ===== */
{
    const b = document.getElementById('tbBtnAbrirPublico');
    b.style.display = '';
    t('T24 · "Abrir Público" fica grudado na borda quando a barra rola',
        getComputedStyle(b).position === 'sticky'
        && Math.round(cx('.tb-topbar').right - b.getBoundingClientRect().right) <= 16);
}

/* ===== custo do véu, medido =====
   O `backdrop-filter` saiu daqui porque borra a viewport inteira — e atrás
   dela está o #tbCanvas com o bitmap do mapa. Este trecho mede: pinta um
   mapa de 4k, põe o véu por cima e conta quadros. Rode NO CELULAR, que é o
   hardware-alvo; num desktop os dois números empatam e não provam nada. */
const quadros = async (veu) => {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:8000;background:rgba(10,13,18,.86)'
        + (veu ? ';backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)' : '');
    document.body.appendChild(d);
    const n = await new Promise(res => {
        let c = 0; const t0 = performance.now();
        const loop = () => { c++; mapa.style.transform = `translateZ(0) rotate(${c * .05}deg)`;
            performance.now() - t0 < 700 ? requestAnimationFrame(loop) : res(c); };
        requestAnimationFrame(loop); setTimeout(() => res(c), 2500);
    });
    d.remove();
    return n ? (700 / n) : 0;
};
const mapa = document.createElement('canvas');
mapa.width = mapa.height = 4096;
mapa.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:-1';
{
    const g = mapa.getContext('2d');
    for (let i = 0; i < 900; i++) {
        g.fillStyle = `hsl(${(i * 37) % 360} 30% ${18 + (i % 22)}%)`;
        g.fillRect((i * 613) % 4096, (i * 971) % 4096, 260, 260);
    }
}
document.body.appendChild(mapa);
const comVeu = await quadros(true), semVeu = await quadros(false);
mapa.remove();
if (!comVeu || !semVeu) {
    linhas.push('<tr><td>T25 · custo do véu</td><td class="ok">'
        + 'não medido — esta aba não compõe quadros; abra a página numa janela real</td></tr>');
} else {
    t(`T07 · sem o blur o quadro não fica mais caro `
      + `(com blur ${comVeu.toFixed(1)}ms · sem blur ${semVeu.toFixed(1)}ms)`, semVeu <= comVeu + 0.5);
}

document.getElementById('saida').innerHTML = linhas.join('');
const f = linhas.filter(l => l.includes('FALHOU')).length;
document.getElementById('placar').innerHTML =
    `<span class="${f?'fail':'ok'}">${linhas.length-f}/${linhas.length}</span>` + (f?` — ${f} falha(s)`:' — tudo certo');
</script>
</body></html>
